name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - nightly
          - release
      version:
        description: Compiler version; must exactly match src/version (empty derives it from src/version)
        required: false
        default: ""
        type: string
      diagnostic_run:
        description: Test-only native package diagnosis using compiler artifacts from this run ID; does not verify or publish a release
        required: false
        default: ""
        type: string

concurrency:
  group: nightly-release-${{ github.repository }}-${{ inputs.diagnostic_run && 'diagnostic' || github.event_name == 'push' && github.ref_name || github.event_name == 'schedule' && 'nightly' || inputs.channel || 'test' }}
  cancel-in-progress: false

permissions: {}

env:
  # A tag push supplies the version independently of the tree, so every job
  # asserts src/version agrees with it -- that check is the only thing stopping
  # a tag being cut against a tree that disagrees about its own version.
  #
  # schedule/workflow_dispatch-without-input have no tag, so there is nothing to
  # cross-check: the version is DERIVED from src/version by the "Resolve and
  # verify version" step below. Deliberately empty here rather than a literal --
  # the previous hardcoded fallback had to be hand-edited on every version bump,
  # was not, and failed every nightly once src/version moved past it.
  WITH_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version || '' }}

jobs:
  dll-copy-diagnostics:
    name: Diagnose Mesa copy on windows-${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            seed_version: nightly-20260930-local-2-bd6e00d1dee6
            seed_asset: with-windows-x86_64.exe
            seed_sha256: 31b57d91cfc3d28eb67cfca268d7c5b461b9d128a19306eb781da194885494b6
            mesa_arch: x64
            mesa_sha256: 418f1938dc48d401538cf6440d3c718e2f456ef2023e44133105263f483e903f
          - arch: aarch64
            runner: windows-11-arm
            seed_version: v0.15.2.1
            seed_asset: with-windows-aarch64.exe
            seed_sha256: bb3b17c64ad057ddc852a5ee6a61a4e4a224780447013699d490e6f726893c73
            mesa_arch: arm64
            mesa_sha256: bd1c00a49504b3efe20037cf29fa437380cfb5cbe73f196272624b94938330f1
    steps:
      - name: Require diagnostic channel
        run: test "${{ inputs.channel }}" = test
      - name: Checkout copy fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch the pinned driver and actual Mesa library
        run: |
          mkdir -p out/dll-copy-probe
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o out/diagnostic-seed.exe "https://github.com/withlang-dev/with/releases/download/${{ matrix.seed_version }}/${{ matrix.seed_asset }}"
          printf '%s  %s\n' '${{ matrix.seed_sha256 }}' out/diagnostic-seed.exe | sha256sum -c -
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o out/mesa.7z "https://github.com/mmozeiko/build-mesa/releases/download/26.2.2/mesa-llvmpipe-${{ matrix.mesa_arch }}-26.2.2.7z"
          printf '%s  %s\n' '${{ matrix.mesa_sha256 }}' out/mesa.7z | sha256sum -c -
          7z x -y -oout/dll-copy-probe out/mesa.7z opengl32.dll
          mv out/dll-copy-probe/opengl32.dll out/dll-copy-probe/source.dll
      - name: Initialize isolated copy project
        working-directory: out/dll-copy-probe
        run: ../diagnostic-seed.exe init .
      - name: Install copy action
        run: cp tools/diagnose_dll_copy_build.w out/dll-copy-probe/build.w
      - name: Copy through the pinned evaluator
        working-directory: out/dll-copy-probe
        run: ../diagnostic-seed.exe build --strict-effects
      - name: Compare original and copied DLL bytes
        if: always()
        working-directory: out/dll-copy-probe
        run: |
          ls -l source.dll out/copied.dll
          file source.dll out/copied.dll
          sha256sum source.dll out/copied.dll
          cmp source.dll out/copied.dll
      - name: Reproduce the UAT's external absolute source
        working-directory: out/dll-copy-probe
        continue-on-error: true
        run: |
          cp out/copied.dll out/relative-copy.dll
          cp source.dll ../external-source.dll
          rm out/copied.dll
          export WITH_UAT_OPENGL32_DLL="$(cygpath -m "$PWD/../external-source.dll")"
          ../diagnostic-seed.exe build --strict-effects
      - name: Inspect external-path copy result
        if: always()
        working-directory: out/dll-copy-probe
        run: |
          ls -l source.dll out/copied.dll
          file source.dll out/copied.dll
          sha256sum source.dll out/copied.dll
          cmp source.dll out/copied.dll
      - name: Preserve DLL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dll-copy-windows-${{ matrix.arch }}
          retention-days: 7
          path: |
            out/dll-copy-probe/source.dll
            out/dll-copy-probe/out/copied.dll
            out/dll-copy-probe/out/relative-copy.dll

  package-diagnostics:
    name: Diagnose ${{ matrix.package }} on windows-${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        package: [bzip2, libcurl]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: windows-latest
            procdump: procdump64.exe
          - arch: aarch64
            runner: windows-11-arm
            procdump: procdump64a.exe
    steps:
      - name: Require diagnostic channel
        run: test "${{ inputs.channel }}" = test
      - name: Checkout diagnostic fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch the exact failed compiler and symbols
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: gh run download "$DIAGNOSTIC_RUN" --repo "$GITHUB_REPOSITORY" --name package-failures-windows-${{ matrix.arch }} --dir out/diagnostic-compiler
      - name: Fetch native stack capture tool
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o out/procdump.zip https://download.sysinternals.com/files/Procdump.zip
          7z x -y -oout/procdump out/procdump.zip
          mkdir -p out/diagnostic-project out/package-dumps
      - name: Initialize isolated package project
        working-directory: out/diagnostic-project
        run: ../diagnostic-compiler/release/bin/with.exe init .
      - name: Fetch current package
        id: fresh-get
        continue-on-error: true
        working-directory: out/diagnostic-project
        run: ../diagnostic-compiler/release/bin/with.exe get c.${{ matrix.package }}
      - name: Expose failed package download
        if: steps.fresh-get.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        working-directory: out/diagnostic-project
        run: |
          Get-Command curl.exe
          curl.exe -v -fSL -o /tmp/with-conan-diagnostic.json "https://center2.conan.io/v2/conans/search?q=${{ matrix.package }}"
      # Investigation of the old binary only: retain the fresh-get failure
      # above, then recreate the full battery's scratch directory so we can
      # reach its separate C import hang. This is never release evidence.
      - name: Reproduce the older compiler's scratch environment
        if: steps.fresh-get.outcome == 'failure'
        shell: pwsh
        run: New-Item -ItemType Directory -Force /tmp
      - name: Fetch package for header stack capture
        if: steps.fresh-get.outcome == 'failure'
        working-directory: out/diagnostic-project
        run: ../diagnostic-compiler/release/bin/with.exe get c.${{ matrix.package }}
      - name: Install the actual UAT fixture
        run: cp build/release_uat_fixtures/${{ matrix.package }}_main.w out/diagnostic-project/src/main.w
      - name: Capture native check stacks
        working-directory: out/diagnostic-project
        timeout-minutes: 3
        env:
          WITH_PROFILE: '1'
        run: ../procdump/${{ matrix.procdump }} -accepteula -mm -n 3 -s 15 -x ../package-dumps ../diagnostic-compiler/release/bin/with.exe check src/main.w
      - name: Preserve stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-stacks-${{ matrix.package }}-windows-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: out/package-dumps

  build:
    name: Verify and package ${{ matrix.platform }}
    if: inputs.diagnostic_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin-aarch64 is a local-first platform: on a `v*` tag push the
          # maintainer's Mac builds, verifies and publishes it (with
          # linux-aarch64, via tools/release_local.w) before CI even starts;
          # CI builds it only for the nightly and test channels, in the
          # build-darwin-aarch64 job below. On a tag push CI builds and
          # appends the x86_64 platforms and windows-aarch64 (which no Mac
          # can build).
          - platform: linux-x86_64
            runner: ubuntu-latest
            sdk_host_tag: linux-x86_64
            seed_repo: withlang-dev/with
            seed_version: nightly-20260926-local-1-2e8defaa18ef
            seed_asset: with-linux-x86_64
            seed_sha256: ce5c3c4729650b215fb166ac8078fe7c7982b094bc4a1e31401e04eb7e7460d0
            sdk_version: nightly-sdk-20260930-6f0394637064
            sdk_asset: with-llvm-sdk-22.1.6-linux-x86_64.tar.gz
            sdk_sha256: 5d3f1a34f677185880d87bb3b9031e6c4f2967bf4fd0b5077fb3c9e702b6a47f
            sdk_sidecar_sha256: bd9719f205d97faa5739a407fcef3fb4950f81c1dcd71ae074513c859a318a25
            sdk_manifest_sha256: 4252f86279af1c7d1d345e649447ec6877726fc176ef58d5584224b457662850
            release_asset: with-linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WITH_SEED_REPO: ${{ matrix.seed_repo }}
      WITH_SEED_VERSION: ${{ matrix.seed_version }}
      WITH_SEED_ASSET: ${{ matrix.seed_asset }}
      WITH_SEED_SHA256: ${{ matrix.seed_sha256 }}
      WITH_SDK_REPO: ${{ github.repository }}
      WITH_SDK_VERSION: ${{ matrix.sdk_version }}
      WITH_SDK_ASSET: ${{ matrix.sdk_asset }}
      WITH_SDK_SHA256: ${{ matrix.sdk_sha256 }}
      WITH_SDK_SIDECAR_SHA256: ${{ matrix.sdk_sidecar_sha256 }}
      WITH_SDK_MANIFEST_SHA256: ${{ matrix.sdk_manifest_sha256 }}
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-${{ matrix.sdk_host_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and verify version
        run: |
          set -euo pipefail
          src="$(tr -d '\r\n' < src/version)"
          test -n "$src"
          if [ -n "$WITH_VERSION" ]; then
            # Tag push or explicit dispatch input: the version was supplied
            # independently, so the tree must agree with it.
            test "$src" = "$WITH_VERSION"
          else
            # Nightly: no tag exists, so src/version IS the version.
            echo "WITH_VERSION=$src" >> "$GITHUB_ENV"
          fi

      - name: Fetch verified bootstrap seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main | shasum -a 256 -c -
          chmod +x src/main
          src/main version

      - name: Fetch verified static LLVM SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive.sha256" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.sha256"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive.manifest" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.manifest"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$archive" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_SIDECAR_SHA256" "$archive.sha256" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_MANIFEST_SHA256" "$archive.manifest" | shasum -a 256 -c -
          mkdir -p .deps
          tar -xzf "$archive" -C .deps
          test -f "$LLVM_PREFIX/lib/libclang.a"
          test -f "$LLVM_PREFIX/lib/clang/22/include/stddef.h"
          test -f "$LLVM_PREFIX/share/cmake-4.2/Modules/CMake.cmake"
          for tool in clang clang++ cmake ninja lld llvm-ar llvm-config llvm-dwarfdump llvm-nm llvm-objcopy llvm-ranlib llvm-readobj llvm-strip; do
            test -x "$LLVM_PREFIX/bin/$tool"
          done
          dangling="$(find -L "$LLVM_PREFIX/bin" -type l -print -quit)"
          if [ -n "$dangling" ]; then
            echo "dangling SDK symlink: $dangling" >&2
            exit 1
          fi
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/cmake" --version
          export PATH="$LLVM_PREFIX/bin:$PATH"
          symbol="$("$LLVM_PREFIX/bin/llvm-nm" -g "$LLVM_PREFIX/lib/libclang.a" | ./src/main -n 'if line.ends_with("clang_createIndex"): print(line)')"
          test -n "$symbol"
          printf '%s\n' "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Verify dependency graph
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :deps

      - name: Build seed to release compiler
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build

      - name: Verify fixpoint
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :fixpoint

      - name: Green battery (build :test)
        # The release UAT gate requires last-green, and last-green requires the
        # test-green evidence `:test` records: the asset this job publishes is
        # the one the battery blessed, not merely the one that fixpointed.
        # Driven by the pinned seed: seed-driver refuses any other driver.
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :test

      - name: Record last-green (the release UAT gate reads it)
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :last-green

      - name: Select rebuilt compiler (the release UAT runs the rebuilt binary as the orchestrator)
        run: echo "WITH=$GITHUB_WORKSPACE/out/release/bin/with" >> "$GITHUB_ENV"

      - name: Provide a display and software OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # xvfb: a virtual X display. libgl1-mesa-dri: Mesa's llvmpipe, the
          # software OpenGL 4.5 the raylib spiral UAT renders through.
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri \
            libgl-dev libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Release UAT (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./out/release/bin/with build :release-uat

      - name: Release UAT (macOS)
        # The runner's session has a WindowServer but no GPU: NSGL finds no
        # pixel format for the OpenGL 3.3 context raylib's GLFW backend wants
        # (#1375). Drawing a spiral does not require a GPU: `with get` builds
        # raylib from source on its RGFW window backend with rlsw, raylib's
        # software rasterizer, and the spiral draws into a real window.
        env:
          WITH_GET_CMAKE_RAYLIB: "PLATFORM=RGFW;OPENGL_VERSION=Software;USE_EXTERNAL_GLFW=OFF"
        if: runner.os == 'macOS'
        # raylib's own sources include Apple framework headers (IOKit,
        # CoreAudio) that only Apple's SDK carries, and the compiler reads no
        # host SDK unless one is named (§16.1, D81). The runner has Xcode: name
        # its SDK, as a user building raylib from source does.
        run: SDKROOT="$(xcrun --show-sdk-path)" ./out/release/bin/with build :release-uat

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with version)" = "with $WITH_VERSION"
          cp out/release/bin/with "out/release/${{ matrix.release_asset }}"
          chmod +x "out/release/${{ matrix.release_asset }}"
          shasum -a 256 "out/release/${{ matrix.release_asset }}" > "out/release/${{ matrix.release_asset }}.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET" "out/release/$WITH_SDK_ASSET"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.sha256" "out/release/$WITH_SDK_ASSET.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.manifest" "out/release/$WITH_SDK_ASSET.manifest"

      - name: Verify packaged checksums
        run: |
          shasum -a 256 -c "out/release/${{ matrix.release_asset }}.sha256"
          shasum -a 256 -c "out/release/$WITH_SDK_ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/${{ matrix.release_asset }}

      # Publish-first: this platform's asset goes onto the release the moment
      # it is verified (the release is created by whichever platform gets
      # there first, add-only after that; build/release_publish.w). Nobody
      # waits for the slowest runner.
      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'release' || inputs.channel }}
        run: |
          set -euo pipefail
          ./out/release/bin/with run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" "$REQUESTED_CHANNEL" "$(date -u +%Y%m%d)" "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" "$GITHUB_OUTPUT" out/release/nightly-release-notes.md "${{ matrix.platform }}"

      - name: Publish this platform's assets (add-only)
        env:
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ASSETS: out/release/${{ matrix.release_asset }}
          # The install scripts (documented in the README Quick Start and mirrored
          # on withlang.org) ship as release assets from the darwin leg only, so
          # `releases/latest/download/install.sh` resolves instead of 404ing (#1144).
          # Uploaded add-only; one leg avoids a cross-job race on the same asset.
          RELEASE_EXTRA_FILES: out/release/${{ matrix.sdk_asset }},out/release/${{ matrix.sdk_asset }}.sha256,out/release/${{ matrix.sdk_asset }}.manifest${{ matrix.platform == 'darwin-aarch64' && ',scripts/install.sh,scripts/install.ps1,scripts/install.cmd' || '' }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BUILDER: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ matrix.platform }})
          RELEASE_REPO: ${{ github.repository }}
        run: ./out/release/bin/with build :publish-release-asset

  build-darwin-aarch64:
    name: Verify and package darwin-aarch64
    # Local-first: on a `v*` tag push this platform is built, verified and
    # published from the maintainer's Mac (tools/release_local.w) minutes
    # after the tag; CI builds it for the nightly and test channels only.
    # The body mirrors the unix matrix job above.
    if: github.event_name != 'push' && inputs.diagnostic_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
            sdk_host_tag: darwin-arm64
            seed_repo: withlang-dev/with
            seed_version: nightly-20261003-local-1-c884c1c2a17c
            seed_asset: with-darwin-aarch64
            seed_sha256: ccc155d5651caf33bcae42c27717f9ed00f2984f7cec4260278faaad207820f0
            sdk_version: nightly-sdk-20261004-8b0595267bb0
            sdk_asset: with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz
            sdk_sha256: d3abcdfd6f6ccc8094929e4053a15c28c45d1672108d5755460cd51607bd9406
            sdk_sidecar_sha256: f4dc074646a19a24167ef577ed2f6965211601563d9cd31acecff65169b41415
            sdk_manifest_sha256: 889371bbfebf203482fa4c2d3dd072681dedec557ad58f21b3f269385dbc064f
            release_asset: with-darwin-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WITH_SEED_REPO: ${{ matrix.seed_repo }}
      WITH_SEED_VERSION: ${{ matrix.seed_version }}
      WITH_SEED_ASSET: ${{ matrix.seed_asset }}
      WITH_SEED_SHA256: ${{ matrix.seed_sha256 }}
      WITH_SDK_REPO: ${{ github.repository }}
      WITH_SDK_VERSION: ${{ matrix.sdk_version }}
      WITH_SDK_ASSET: ${{ matrix.sdk_asset }}
      WITH_SDK_SHA256: ${{ matrix.sdk_sha256 }}
      WITH_SDK_SIDECAR_SHA256: ${{ matrix.sdk_sidecar_sha256 }}
      WITH_SDK_MANIFEST_SHA256: ${{ matrix.sdk_manifest_sha256 }}
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-${{ matrix.sdk_host_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and verify version
        run: |
          set -euo pipefail
          src="$(tr -d '\r\n' < src/version)"
          test -n "$src"
          if [ -n "$WITH_VERSION" ]; then
            test "$src" = "$WITH_VERSION"
          else
            echo "WITH_VERSION=$src" >> "$GITHUB_ENV"
          fi

      - name: Fetch verified bootstrap seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main | shasum -a 256 -c -
          chmod +x src/main
          src/main version

      - name: Fetch verified static LLVM SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive.sha256" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.sha256"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive.manifest" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.manifest"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$archive" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_SIDECAR_SHA256" "$archive.sha256" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_MANIFEST_SHA256" "$archive.manifest" | shasum -a 256 -c -
          mkdir -p .deps
          tar -xzf "$archive" -C .deps
          test -f "$LLVM_PREFIX/lib/libclang.a"
          test -f "$LLVM_PREFIX/lib/clang/22/include/stddef.h"
          test -f "$LLVM_PREFIX/share/cmake-4.2/Modules/CMake.cmake"
          for tool in clang clang++ cmake ninja lld llvm-ar llvm-config llvm-dwarfdump llvm-nm llvm-objcopy llvm-ranlib llvm-readobj llvm-strip; do
            test -x "$LLVM_PREFIX/bin/$tool"
          done
          dangling="$(find -L "$LLVM_PREFIX/bin" -type l -print -quit)"
          if [ -n "$dangling" ]; then
            echo "dangling SDK symlink: $dangling" >&2
            exit 1
          fi
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/cmake" --version
          export PATH="$LLVM_PREFIX/bin:$PATH"
          symbol="$("$LLVM_PREFIX/bin/llvm-nm" -g "$LLVM_PREFIX/lib/libclang.a" | ./src/main -n 'if line.ends_with("clang_createIndex"): print(line)')"
          test -n "$symbol"
          printf '%s\n' "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Verify dependency graph
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :deps

      - name: Build seed to release compiler
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build

      - name: Verify fixpoint
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :fixpoint

      - name: Green battery (build :test)
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :test

      - name: Record last-green (the release UAT gate reads it)
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :last-green

      - name: Select rebuilt compiler (the release UAT runs the rebuilt binary as the orchestrator)
        run: echo "WITH=$GITHUB_WORKSPACE/out/release/bin/with" >> "$GITHUB_ENV"

      - name: Release UAT (macOS)
        # The runner's session has a WindowServer but no GPU: NSGL finds no
        # pixel format for the OpenGL 3.3 context raylib's GLFW backend wants
        # (#1375). Drawing a spiral does not require a GPU: `with get` builds
        # raylib from source on its RGFW window backend with rlsw, raylib's
        # software rasterizer, and the spiral draws into a real window.
        env:
          WITH_GET_CMAKE_RAYLIB: "PLATFORM=RGFW;OPENGL_VERSION=Software;USE_EXTERNAL_GLFW=OFF"
        # raylib's own sources include Apple framework headers (IOKit,
        # CoreAudio) that only Apple's SDK carries, and the compiler reads no
        # host SDK unless one is named (§16.1, D81). The runner has Xcode: name
        # its SDK, as a user building raylib from source does.
        run: SDKROOT="$(xcrun --show-sdk-path)" ./out/release/bin/with build :release-uat

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with version)" = "with $WITH_VERSION"
          cp out/release/bin/with "out/release/${{ matrix.release_asset }}"
          chmod +x "out/release/${{ matrix.release_asset }}"
          shasum -a 256 "out/release/${{ matrix.release_asset }}" > "out/release/${{ matrix.release_asset }}.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET" "out/release/$WITH_SDK_ASSET"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.sha256" "out/release/$WITH_SDK_ASSET.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.manifest" "out/release/$WITH_SDK_ASSET.manifest"

      - name: Verify packaged checksums
        run: |
          shasum -a 256 -c "out/release/${{ matrix.release_asset }}.sha256"
          shasum -a 256 -c "out/release/$WITH_SDK_ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/${{ matrix.release_asset }}

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'release' || inputs.channel }}
        run: |
          set -euo pipefail
          ./out/release/bin/with run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" "$REQUESTED_CHANNEL" "$(date -u +%Y%m%d)" "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" "$GITHUB_OUTPUT" out/release/nightly-release-notes.md "${{ matrix.platform }}"

      - name: Publish this platform's assets (add-only)
        env:
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ASSETS: out/release/${{ matrix.release_asset }}
          # The install scripts (README Quick Start, mirrored on withlang.org)
          # ship from the darwin leg only (#1144); add-only, one leg, no race.
          RELEASE_EXTRA_FILES: out/release/${{ matrix.sdk_asset }},out/release/${{ matrix.sdk_asset }}.sha256,out/release/${{ matrix.sdk_asset }}.manifest,scripts/install.sh,scripts/install.ps1,scripts/install.cmd
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BUILDER: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ matrix.platform }})
          RELEASE_REPO: ${{ github.repository }}
        run: ./out/release/bin/with build :publish-release-asset

  build-windows:
    name: Verify and package windows-x86_64
    if: inputs.diagnostic_run == ''
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Native Windows self-host mirrors .github/workflows/selfhost-windows.yml:
      # the published Windows seed builds stage1 -> stage2 -> stage3, we assert
      # stage2 == stage3 (fixpoint), then package the fixpoint-verified with.exe.
      # The unix matrix build above cannot cover Windows -- its steps use shasum,
      # tar -xzf, libclang.a and POSIX paths -- so Windows is a sibling job.
      WITH_SEED_REPO: withlang-dev/with
      # Seed from a released, versioned asset -- never a hand-cut
      # seed-windows-x86_64-<sha> release (unapproved manual uploads). v0.15.1.4's
      # with-windows-x86_64.exe is CI-produced by this workflow from post-#806 main,
      # so it carries the win64 aggregate-return ABI fix. The old v0.15.1.3 seed
      # predated that fix; a compiler bootstrapped from it self-perpetuates the
      # miscompile and crashes (0xC0000005) compiling any regex literal at comptime.
      # build and :fixpoint never compile a regex, so that poison shipped green.
      WITH_SEED_VERSION: nightly-20260930-local-2-bd6e00d1dee6
      WITH_SEED_ASSET: with-windows-x86_64.exe
      WITH_SEED_SHA256: 31b57d91cfc3d28eb67cfca268d7c5b461b9d128a19306eb781da194885494b6
      # The windows-gnu SDK of sdk.lock (#1915): its own C runtime, so the
      # job reads no Visual Studio and no Windows SDK. The archive digest is
      # pinned here; the release republishes the verified archive as is.
      WITH_SDK_REPO: withlang-dev/with
      WITH_SDK_VERSION: nightly-sdk-20260930-6cd934e82b4d
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-windows-x86_64.tar.gz
      WITH_SDK_SHA256: a24652c52d9fb1aa32210b3d765f2c74e6b221648f7d891b73c879350d785bd7
      WITH_SDK_PUBLISH_ASSET: with-llvm-sdk-22.1.6-windows-x86_64.tar.gz
      # windows-latest is a 4-vCPU runner; pin the worker pool to the real core
      # count (the seed's rt_sysinfo reads the wrong SYSTEM_INFO offset, which would
      # otherwise oversubscribe the pool). Honoured before the core probe.
      WITH_BUILD_JOBS: "4"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and verify version
        run: |
          set -euo pipefail
          src="$(tr -d '\r\n' < src/version)"
          test -n "$src"
          if [ -n "$WITH_VERSION" ]; then
            # Tag push or explicit dispatch input: the version was supplied
            # independently, so the tree must agree with it.
            test "$src" = "$WITH_VERSION"
          else
            # Nightly: no tag exists, so src/version IS the version.
            echo "WITH_VERSION=$src" >> "$GITHUB_ENV"
          fi

      - name: Fetch verified Windows LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          # git-bash GNU tar treats "D:\..." as host:path (the drive colon looks
          # like host:path), so keep the archive on an msys path.
          sdk="$(cygpath -u "$RUNNER_TEMP")/sdk.tar.gz"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$sdk" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$sdk" | sha256sum -c -
          tar -xzf "$sdk" -C .deps
          mkdir -p out/release
          cp "$sdk" "out/release/$WITH_SDK_PUBLISH_ASSET"
          prefix=".deps/llvm-22.1.6-windows-x86_64-msvc"
          test -f "$prefix/lib/libclang.a" || { echo "SDK libclang.a missing"; exit 1; }
          test -f "$prefix/bin/lld-link.exe" || { echo "SDK lld-link.exe missing"; exit 1; }
          test -f "$prefix/libc/windows/include/stdio.h" || { echo "SDK C runtime missing"; exit 1; }

      - name: Fetch verified Windows seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main.exe \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main.exe | sha256sum -c -
          ./src/main.exe version

      - name: Configure native toolchain env
        run: |
          set -euo pipefail
          # The compiler and every child link process are native Windows exes, so
          # they need Windows-form paths (cygpath -m keeps forward slashes, which
          # both the file APIs and lld-link accept).
          echo "WITH=$(cygpath -m "$PWD/src/main.exe")" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(cygpath -m "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc")" >> "$GITHUB_ENV"
          # The C runtime and every import library come from the SDK (#1915);
          # nothing here names Visual Studio or a Windows SDK.
          echo "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc/bin" >> "$GITHUB_PATH"

      - name: Build seed to release compiler
        run: ./src/main.exe build

      - name: Verify fixpoint
        run: ./src/main.exe build :fixpoint

      - name: Regex smoke test (guard against poison seed)
        # build and :fixpoint never compile a regex, so a compiler that crashes
        # (0xC0000005) on regex literals passes them yet is unusable. Exercise the
        # exact comptime path here: this fixture is pure /.../ regex literals with
        # no member imports, so a poison binary aborts and this step fails instead
        # of packaging it green.
        run: ./out/release/bin/with.exe check test/behavior/behav_regex_language_semantics.w

      - name: Green battery (build :test)
        # last-green requires the test-green evidence `:test` records; driven
        # with the seed as the selfhost lane does.
        run: ./src/main.exe build :test

      - name: Record last-green (the release UAT gate reads it)
        run: ./src/main.exe build :last-green

      - name: Provide software OpenGL (Mesa llvmpipe)
        # The runner's stock driver stops at OpenGL 1.1; raylib needs 3.3. The
        # spiral UAT places this opengl32.dll beside the program it builds
        # (WITH_UAT_OPENGL32_DLL; Windows loads a DLL from the program's own
        # directory first). Pinned llvmpipe build from mmozeiko/build-mesa.
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mesa-llvmpipe-x64-26.2.2.7z"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" \
            "https://github.com/mmozeiko/build-mesa/releases/download/26.2.2/mesa-llvmpipe-x64-26.2.2.7z"
          printf '%s  %s\n' "418f1938dc48d401538cf6440d3c718e2f456ef2023e44133105263f483e903f" "$archive" | sha256sum -c -
          mkdir -p out/release-uat/mesa
          7z x -y -oout/release-uat/mesa "$archive" opengl32.dll > /dev/null
          test -f out/release-uat/mesa/opengl32.dll
          echo "WITH_UAT_OPENGL32_DLL=out/release-uat/mesa/opengl32.dll" >> "$GITHUB_ENV"

      - name: Release UAT
        # Driven by the seed, not the rebuilt binary: the UAT tests the
        # platform asset (release_platform_asset_bin) whichever driver runs
        # it, and its `build` dependency relinks out/release/bin/with.exe on
        # every invocation (#1157) — Windows cannot replace a running
        # executable ("could not rename out/release/bin/with.exe.tmp").
        run: ./src/main.exe build :release-uat

      - name: Fetch native hang capture tool (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o out/procdump.zip https://download.sysinternals.com/files/Procdump.zip
          7z x -y -oout/procdump out/procdump.zip
          mkdir -p out/package-dumps/bzip2 out/package-dumps/libcurl

      - name: Diagnose bzip2 check (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        timeout-minutes: 3
        continue-on-error: true
        working-directory: out/uat/bzip2/tmp
        env:
          WITH_PROFILE: '1'
        run: ../../../procdump/procdump64.exe -accepteula -mm -n 3 -s 15 -x ../../../package-dumps/bzip2 ../../../release/bin/with.exe check src/main.w

      - name: Diagnose libcurl check (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        timeout-minutes: 3
        continue-on-error: true
        working-directory: out/uat/libcurl/tmp
        env:
          WITH_PROFILE: '1'
        run: ../../../procdump/procdump64.exe -accepteula -mm -n 3 -s 15 -x ../../../package-dumps/libcurl ../../../release/bin/with.exe check src/main.w

      - name: Inspect spiral DLL integrity (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        continue-on-error: true
        run: |
          sha256sum "$WITH_UAT_OPENGL32_DLL" out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll
          "$LLVM_PREFIX/bin/llvm-readobj.exe" --file-headers "$WITH_UAT_OPENGL32_DLL" out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll
          ls -l out/uat/raylib_spiral_windows/tmp/out/bin

      - name: Preserve native package failure evidence (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-failures-windows-x86_64
          retention-days: 7
          path: |
            out/package-dumps
            out/release/bin/with.exe
            out/release/bin/*.pdb
            out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with.exe version)" = "with $WITH_VERSION"
          cp out/release/bin/with.exe out/release/with-windows-x86_64.exe
          sha256sum out/release/with-windows-x86_64.exe > out/release/with-windows-x86_64.exe.sha256
          # A compiler linked from a windows-gnu SDK (lib/libclang.a) carries
          # mingw-w64's runtime code, whose licenses require their notices in
          # a binary distribution (#1915): publish them beside the binary, as
          # build/package.w's pkg_write_windows_notice does for :package-*.
          if [ -f "$LLVM_PREFIX/lib/libclang.a" ]; then
            { printf 'The With compiler for Windows (with-windows-x86_64.exe) statically links the mingw-w64\nruntime (startup and support code) from its LLVM SDK. Its notices follow.\n\n'; cat "$LLVM_PREFIX/libc/windows/COPYING.MinGW-w64-runtime.txt"; } > out/release/with-windows-x86_64-NOTICE.txt
            echo "WITH_NOTICE_FILES=,out/release/with-windows-x86_64-NOTICE.txt" >> "$GITHUB_ENV"
          fi
          # Every release carries this platform's LLVM SDK too: `with build
          # :deps` resolves the SDK from a release asset, so a release without
          # one leaves a Windows box with no way to provision a toolchain. The
          # archive published is the one whose digest was verified above.
          sha256sum "out/release/$WITH_SDK_PUBLISH_ASSET" > "out/release/$WITH_SDK_PUBLISH_ASSET.sha256"

      - name: Verify packaged checksum
        run: |
          set -euo pipefail
          sha256sum -c out/release/with-windows-x86_64.exe.sha256
          sha256sum -c "out/release/$WITH_SDK_PUBLISH_ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/with-windows-x86_64.exe

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'release' || inputs.channel }}
        run: |
          set -euo pipefail
          ./out/release/bin/with.exe run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" "$REQUESTED_CHANNEL" "$(date -u +%Y%m%d)" "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" "$GITHUB_OUTPUT" out/release/nightly-release-notes.md windows-x86_64

      - name: Publish this platform's assets (add-only)
        env:
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ASSETS: out/release/with-windows-x86_64.exe
          RELEASE_EXTRA_FILES: out/release/${{ env.WITH_SDK_PUBLISH_ASSET }},out/release/${{ env.WITH_SDK_PUBLISH_ASSET }}.sha256${{ env.WITH_NOTICE_FILES }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BUILDER: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (windows-x86_64)
          RELEASE_REPO: ${{ github.repository }}
        run: ./out/release/bin/with.exe build :publish-release-asset

  build-linux-aarch64:
    name: Verify and package linux-aarch64
    # Local-first: on a `v*` tag push this platform is built, verified and
    # published from the maintainer's Mac (tools/release_local.w, the
    # linux/arm64 container in tools/docker/linux-aarch64). CI builds it for
    # the nightly and test channels only.
    if: github.event_name != 'push' && inputs.diagnostic_run == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Native linux-aarch64 self-host mirrors .github/workflows/selfhost-linux-aarch64.yml:
      # the published seed builds stage1 -> stage2 -> stage3, we assert stage2 ==
      # stage3 (fixpoint), then package the fixpoint-verified binary. This is a
      # sibling job rather than a `build` matrix entry because this platform's SDK
      # ships without .sha256/.manifest sidecars (as on Windows), so the archive
      # digest is pinned directly here instead of fetching sidecar files.
      WITH_SEED_REPO: withlang-dev/with
      # The seed.lock pin (#1915): a self-contained compiler that embeds its
      # runtime, sysroot and lld, so it needs no runtime bundle, linker shim
      # or host libxml2.
      WITH_SEED_VERSION: nightly-20261003-local-2-b78ceca2d3c5
      WITH_SEED_ASSET: with-linux-aarch64
      WITH_SEED_SHA256: c5b434ce739a0ef2a8beddf09abd30f1f501aa2b9227b07a0b16bdf65f8f2898
      WITH_SDK_REPO: withlang-dev/with
      WITH_SDK_VERSION: nightly-sdk-20260930-e997223d40ce
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-linux-aarch64.tar.gz
      WITH_SDK_SHA256: 4fe9695ef30a05d2f15bd0095b2d8b892ae9102930ca520b382ab545a3727a2b
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and verify version
        run: |
          set -euo pipefail
          src="$(tr -d '\r\n' < src/version)"
          test -n "$src"
          if [ -n "$WITH_VERSION" ]; then
            # Tag push or explicit dispatch input: the version was supplied
            # independently, so the tree must agree with it.
            test "$src" = "$WITH_VERSION"
          else
            # Nightly: no tag exists, so src/version IS the version.
            echo "WITH_VERSION=$src" >> "$GITHUB_ENV"
          fi

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # bz2, sqlite3, curl: the facade tests c_import the host's bzlib.h,
          # sqlite3.h and curl/curl.h (a UAT project gets them from `with get`).
          # The compiler itself links nothing of the host (#1915, D81).
          sudo apt-get install -y --no-install-recommends libbz2-dev libsqlite3-dev libcurl4-openssl-dev

      - name: Fetch verified LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/sdk.tar.gz" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$RUNNER_TEMP/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sdk.tar.gz" -C .deps
          prefix=".deps/llvm-22.1.6-linux-aarch64"
          test -f "$prefix/lib/libclang.a" || { echo "SDK libclang.a missing"; exit 1; }
          test -x "$prefix/bin/lld" || { echo "SDK lld missing"; exit 1; }
          echo "LLVM_PREFIX=$PWD/$prefix" >> "$GITHUB_ENV"

      - name: Fetch verified seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main | sha256sum -c -
          chmod +x src/main
          ./src/main version
          # Fail fast if the seed cannot link, rather than part-way through a build.
          printf 'fn main:\n    print("seed links")\n' > "$RUNNER_TEMP/seedcheck.w"
          ./src/main run "$RUNNER_TEMP/seedcheck.w"

      - name: Build seed to release compiler
        run: ./src/main build

      - name: Verify fixpoint
        run: ./src/main build :fixpoint

      - name: Green battery (build :test)
        # last-green requires the test-green evidence `:test` records; driven
        # by the pinned seed (seed-driver refuses any other driver).
        env:
          WITH: ${{ github.workspace }}/src/main
        run: ./src/main build :test

      - name: Record last-green (the release UAT gate reads it)
        env:
          WITH: ${{ github.workspace }}/src/main
        run: ./src/main build :last-green

      - name: Provide a display and software OpenGL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # xvfb: a virtual X display. libgl1-mesa-dri: Mesa's llvmpipe, the
          # software OpenGL 4.5 the raylib spiral UAT renders through.
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri \
            libgl-dev libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Release UAT (under Xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./out/release/bin/with build :release-uat

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with version)" = "with $WITH_VERSION"
          cp out/release/bin/with out/release/with-linux-aarch64
          chmod +x out/release/with-linux-aarch64
          sha256sum out/release/with-linux-aarch64 > out/release/with-linux-aarch64.sha256
          # As on the Windows jobs: republish this platform's SDK so
          # `with build :deps` can resolve one from the release.
          cp "$RUNNER_TEMP/sdk.tar.gz" "out/release/$WITH_SDK_ASSET"
          sha256sum "out/release/$WITH_SDK_ASSET" > "out/release/$WITH_SDK_ASSET.sha256"

      - name: Verify packaged checksum
        run: |
          set -euo pipefail
          sha256sum -c out/release/with-linux-aarch64.sha256
          sha256sum -c "out/release/$WITH_SDK_ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/with-linux-aarch64

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'release' || inputs.channel }}
        run: |
          set -euo pipefail
          ./out/release/bin/with run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" "$REQUESTED_CHANNEL" "$(date -u +%Y%m%d)" "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" "$GITHUB_OUTPUT" out/release/nightly-release-notes.md linux-aarch64

      - name: Publish this platform's assets (add-only)
        env:
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ASSETS: out/release/with-linux-aarch64
          RELEASE_EXTRA_FILES: out/release/${{ env.WITH_SDK_ASSET }},out/release/${{ env.WITH_SDK_ASSET }}.sha256
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BUILDER: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (linux-aarch64)
          RELEASE_REPO: ${{ github.repository }}
        run: ./out/release/bin/with build :publish-release-asset

  build-windows-aarch64:
    name: Verify and package windows-aarch64
    if: inputs.diagnostic_run == ''
    runs-on: windows-11-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Native Windows-on-ARM64 self-host mirrors
      # .github/workflows/selfhost-windows-aarch64.yml: the published arm64
      # Windows seed builds stage1 -> stage2 -> stage3, we assert stage2 ==
      # stage3 (fixpoint), then package the fixpoint-verified with.exe. Like
      # build-windows this is a sibling job (not a `build` matrix entry): its
      # steps use cygpath/vswhere and the SDK ships without sidecars.
      WITH_SEED_REPO: withlang-dev/with
      # CI-produced by seed-windows-aarch64.yml (cross-built on Linux, published
      # to the seed-windows-aarch64 prerelease) -- never a hand-uploaded asset.
      WITH_SEED_VERSION: v0.15.2.1
      WITH_SEED_ASSET: with-windows-aarch64.exe
      WITH_SEED_SHA256: bb3b17c64ad057ddc852a5ee6a61a4e4a224780447013699d490e6f726893c73
      WITH_SDK_REPO: withlang-dev/with
      WITH_SDK_VERSION: sdk-windows-aarch64
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-windows-aarch64.tar.gz
      WITH_SDK_SHA256: ad13e07af474d683c699f041c52cd98697df9781b581dda913d39d92be186743
      # Pin the worker pool to the arm64 runner's real core count (the seed's
      # rt_sysinfo reads the wrong SYSTEM_INFO offset, which would otherwise
      # oversubscribe the pool). Honoured before the core probe.
      WITH_BUILD_JOBS: "4"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and verify version
        run: |
          set -euo pipefail
          src="$(tr -d '\r\n' < src/version)"
          test -n "$src"
          if [ -n "$WITH_VERSION" ]; then
            # Tag push or explicit dispatch input: the version was supplied
            # independently, so the tree must agree with it.
            test "$src" = "$WITH_VERSION"
          else
            # Nightly: no tag exists, so src/version IS the version.
            echo "WITH_VERSION=$src" >> "$GITHUB_ENV"
          fi

      - name: Fetch verified windows-aarch64 LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          # git-bash GNU tar treats "D:\..." as host:path (the drive colon looks
          # like host:path), so keep the archive on an msys path.
          sdk="$(cygpath -u "$RUNNER_TEMP")/sdk.tar.gz"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$sdk" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$sdk" | sha256sum -c -
          tar -xzf "$sdk" -C .deps
          prefix=".deps/llvm-22.1.6-windows-aarch64-msvc"
          test -f "$prefix/lib/libclang.lib" || { echo "SDK libclang.lib missing"; exit 1; }
          test -f "$prefix/bin/lld-link.exe" || { echo "SDK lld-link.exe missing"; exit 1; }

      - name: Fetch verified windows-aarch64 seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main.exe \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main.exe | sha256sum -c -
          ./src/main.exe version

      - name: Configure native toolchain env
        run: |
          set -euo pipefail
          # The compiler and every child link process are native Windows exes, so
          # they need Windows-form paths (cygpath -m keeps forward slashes, which
          # both the file APIs and lld-link accept).
          echo "WITH=$(cygpath -m "$PWD/src/main.exe")" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(cygpath -m "$PWD/.deps/llvm-22.1.6-windows-aarch64-msvc")" >> "$GITHUB_ENV"
          # MSVC CRT + Windows SDK import libs (Link.w reads WITH_WINDOWS_{MSVC,UCRT,UM}_LIBDIR).
          # This is the arm64 runner, so the ARM64 lib subdirs are the native target.
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs_root="$(cygpath -u "$("$vswhere" -latest -products '*' -property installationPath)")"
          msvc_ver="$(ls "$vs_root/VC/Tools/MSVC" | sort -V | tail -1)"
          echo "WITH_WINDOWS_MSVC_LIBDIR=$(cygpath -m "$vs_root/VC/Tools/MSVC/$msvc_ver/lib/arm64")" >> "$GITHUB_ENV"
          kit_root="/c/Program Files (x86)/Windows Kits/10/Lib"
          kit_ver="$(ls "$kit_root" | grep -E '^10\.' | sort -V | tail -1)"
          echo "WITH_WINDOWS_UCRT_LIBDIR=$(cygpath -m "$kit_root/$kit_ver/ucrt/arm64")" >> "$GITHUB_ENV"
          echo "WITH_WINDOWS_UM_LIBDIR=$(cygpath -m "$kit_root/$kit_ver/um/arm64")" >> "$GITHUB_ENV"
          echo "$PWD/.deps/llvm-22.1.6-windows-aarch64-msvc/bin" >> "$GITHUB_PATH"
          # The runner's ambient MSYS binutils nm cannot parse an arm64 COFF
          # image; the object-symbol and bundle-interface tests read nm through
          # bs_build_w_tool_from_env("NM", ...), so point them at the SDK's
          # llvm-nm (same as selfhost-windows-aarch64.yml).
          echo "NM=$(cygpath -m "$PWD/.deps/llvm-22.1.6-windows-aarch64-msvc/bin/llvm-nm.exe")" >> "$GITHUB_ENV"

      - name: Build seed to release compiler
        run: ./src/main.exe build

      - name: Verify fixpoint
        run: ./src/main.exe build :fixpoint

      - name: Green battery (build :test)
        # last-green requires the test-green evidence `:test` records; driven
        # with the seed as the selfhost lane does.
        run: ./src/main.exe build :test

      - name: Record last-green (the release UAT gate reads it)
        run: ./src/main.exe build :last-green

      - name: Provide software OpenGL (Mesa llvmpipe, arm64)
        # As on windows-x86_64: the spiral UAT places this opengl32.dll beside
        # the program it builds (WITH_UAT_OPENGL32_DLL). Pinned arm64 llvmpipe
        # build from mmozeiko/build-mesa.
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mesa-llvmpipe-arm64-26.2.2.7z"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" \
            "https://github.com/mmozeiko/build-mesa/releases/download/26.2.2/mesa-llvmpipe-arm64-26.2.2.7z"
          printf '%s  %s\n' "bd1c00a49504b3efe20037cf29fa437380cfb5cbe73f196272624b94938330f1" "$archive" | sha256sum -c -
          mkdir -p out/release-uat/mesa
          7z x -y -oout/release-uat/mesa "$archive" opengl32.dll > /dev/null
          test -f out/release-uat/mesa/opengl32.dll
          echo "WITH_UAT_OPENGL32_DLL=out/release-uat/mesa/opengl32.dll" >> "$GITHUB_ENV"

      - name: Release UAT
        # Driven by the seed, not the rebuilt binary: the UAT tests the
        # platform asset (release_platform_asset_bin) whichever driver runs
        # it, and its `build` dependency relinks out/release/bin/with.exe on
        # every invocation (#1157) — Windows cannot replace a running
        # executable ("could not rename out/release/bin/with.exe.tmp").
        run: ./src/main.exe build :release-uat

      - name: Fetch native hang capture tool (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o out/procdump.zip https://download.sysinternals.com/files/Procdump.zip
          7z x -y -oout/procdump out/procdump.zip
          mkdir -p out/package-dumps/bzip2 out/package-dumps/libcurl

      - name: Diagnose bzip2 check (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        timeout-minutes: 3
        continue-on-error: true
        working-directory: out/uat/bzip2/tmp
        env:
          WITH_PROFILE: '1'
        run: ../../../procdump/procdump64a.exe -accepteula -mm -n 3 -s 15 -x ../../../package-dumps/bzip2 ../../../release/bin/with.exe check src/main.w

      - name: Diagnose libcurl check (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        timeout-minutes: 3
        continue-on-error: true
        working-directory: out/uat/libcurl/tmp
        env:
          WITH_PROFILE: '1'
        run: ../../../procdump/procdump64a.exe -accepteula -mm -n 3 -s 15 -x ../../../package-dumps/libcurl ../../../release/bin/with.exe check src/main.w

      - name: Inspect spiral DLL integrity (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        continue-on-error: true
        run: |
          sha256sum "$WITH_UAT_OPENGL32_DLL" out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll
          "$LLVM_PREFIX/bin/llvm-readobj.exe" --file-headers "$WITH_UAT_OPENGL32_DLL" out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll
          ls -l out/uat/raylib_spiral_windows/tmp/out/bin

      - name: Preserve native package failure evidence (test channel)
        if: ${{ failure() && inputs.channel == 'test' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-failures-windows-aarch64
          retention-days: 7
          path: |
            out/package-dumps
            out/release/bin/with.exe
            out/release/bin/*.pdb
            out/uat/raylib_spiral_windows/tmp/out/bin/opengl32.dll

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with.exe version)" = "with $WITH_VERSION"
          cp out/release/bin/with.exe out/release/with-windows-aarch64.exe
          sha256sum out/release/with-windows-aarch64.exe > out/release/with-windows-aarch64.exe.sha256
          # As on windows-x86_64: republish this platform's SDK so `with build
          # :deps` can resolve one from the release being bootstrapped.
          cp "$(cygpath -u "$RUNNER_TEMP")/sdk.tar.gz" "out/release/$WITH_SDK_ASSET"
          sha256sum "out/release/$WITH_SDK_ASSET" > "out/release/$WITH_SDK_ASSET.sha256"

      - name: Verify packaged checksum
        run: |
          set -euo pipefail
          sha256sum -c out/release/with-windows-aarch64.exe.sha256
          sha256sum -c "out/release/$WITH_SDK_ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/with-windows-aarch64.exe

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'release' || inputs.channel }}
        run: |
          set -euo pipefail
          ./out/release/bin/with.exe run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" "$REQUESTED_CHANNEL" "$(date -u +%Y%m%d)" "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" "$GITHUB_OUTPUT" out/release/nightly-release-notes.md windows-aarch64

      - name: Publish this platform's assets (add-only)
        env:
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ASSETS: out/release/with-windows-aarch64.exe
          RELEASE_EXTRA_FILES: out/release/${{ env.WITH_SDK_ASSET }},out/release/${{ env.WITH_SDK_ASSET }}.sha256
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BUILDER: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (windows-aarch64)
          RELEASE_REPO: ${{ github.repository }}
        run: ./out/release/bin/with.exe build :publish-release-asset
