name: Release

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - nightly
          - release
      version:
        description: Compiler version; must exactly match src/version
        required: false
        default: v0.15.1.2
        type: string

concurrency:
  group: nightly-release-${{ github.repository }}-${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'test' }}
  cancel-in-progress: false

permissions: {}

env:
  WITH_VERSION: ${{ inputs.version || 'v0.15.1' }}

jobs:
  build:
    name: Verify and package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
            sdk_host_tag: darwin-arm64
            seed_repo: withlang-dev/with
            seed_version: with-darwin-aarch64
            seed_asset: with-darwin-aarch64
            seed_sha256: 7223e03b2fd5f0153c1932f51c4be2fe1a98589cf853a535f715742af1039dc3
            sdk_version: nightly-sdk-test-20260815-680aa139
            sdk_asset: with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz
            sdk_sha256: 4f99fc99a933ee3cf0578336a4fbbbcaaedbbe89112cd49454ea64149c188e6d
            sdk_sidecar_sha256: 0df49017de4631cdc6367eb66dd39f15657b793757a65d743393898f9d848a75
            sdk_manifest_sha256: 96e84c9b27a6d0dfbfe33cc221aebabdc2daaaeea04dc0b04721c61109a53623
            release_asset: with-darwin-aarch64
          - platform: linux-x86_64
            runner: ubuntu-latest
            sdk_host_tag: linux-x86_64
            seed_repo: withlang-dev/with
            seed_version: seed-linux-tip-368c81bf
            seed_asset: with-linux-x86_64
            seed_sha256: bd3a76844f23f9ecbe23cc1a4138087bd80ece2df41db2408e59a60b180c2019
            sdk_version: nightly-sdk-test-20260815-680aa139
            sdk_asset: with-llvm-sdk-22.1.6-linux-x86_64.tar.gz
            sdk_sha256: c7747403c3556ba9ca6e8f47c5db023798c7c5828c807c4a3b474f0c87db24db
            sdk_sidecar_sha256: e706ecf5c187a47fe908193093a4c0b07042c15308a1ecef365bc8bc2c34d32b
            sdk_manifest_sha256: c9771032305fa37289f2344a18aa8d8bfbc45c2b5c1e5348a3f64264095e793d
            release_asset: with-linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      WITH_SEED_REPO: ${{ matrix.seed_repo }}
      WITH_SEED_VERSION: ${{ matrix.seed_version }}
      WITH_SEED_ASSET: ${{ matrix.seed_asset }}
      WITH_SEED_SHA256: ${{ matrix.seed_sha256 }}
      WITH_SDK_REPO: ${{ github.repository }}
      WITH_SDK_VERSION: ${{ matrix.sdk_version }}
      WITH_SDK_ASSET: ${{ matrix.sdk_asset }}
      WITH_SDK_SHA256: ${{ matrix.sdk_sha256 }}
      WITH_SDK_SIDECAR_SHA256: ${{ matrix.sdk_sidecar_sha256 }}
      WITH_SDK_MANIFEST_SHA256: ${{ matrix.sdk_manifest_sha256 }}
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-${{ matrix.sdk_host_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release version
        run: test "$(tr -d '\r\n' < src/version)" = "$WITH_VERSION"

      - name: Fetch verified bootstrap seed
        run: |
          set -euo pipefail
          curl -fL -o src/main \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main | shasum -a 256 -c -
          chmod +x src/main
          src/main version

      - name: Fetch verified static LLVM SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$WITH_SDK_ASSET"
          curl -fL -o "$archive" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          curl -fL -o "$archive.sha256" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.sha256"
          curl -fL -o "$archive.manifest" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.manifest"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$archive" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_SIDECAR_SHA256" "$archive.sha256" | shasum -a 256 -c -
          printf '%s  %s\n' "$WITH_SDK_MANIFEST_SHA256" "$archive.manifest" | shasum -a 256 -c -
          mkdir -p .deps
          tar -xzf "$archive" -C .deps
          test -f "$LLVM_PREFIX/lib/libclang.a"
          test -f "$LLVM_PREFIX/lib/clang/22/include/stddef.h"
          test -f "$LLVM_PREFIX/share/cmake-4.2/Modules/CMake.cmake"
          for tool in clang clang++ cmake ninja lld llvm-ar llvm-config llvm-dwarfdump llvm-nm llvm-objcopy llvm-ranlib llvm-readobj llvm-strip; do
            test -x "$LLVM_PREFIX/bin/$tool"
          done
          dangling="$(find -L "$LLVM_PREFIX/bin" -type l -print -quit)"
          if [ -n "$dangling" ]; then
            echo "dangling SDK symlink: $dangling" >&2
            exit 1
          fi
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/cmake" --version
          export PATH="$LLVM_PREFIX/bin:$PATH"
          symbol="$("$LLVM_PREFIX/bin/llvm-nm" -g "$LLVM_PREFIX/lib/libclang.a" | ./src/main -n 'if line.ends_with("clang_createIndex"): print(line)')"
          test -n "$symbol"
          printf '%s\n' "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Verify dependency graph
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build :deps

      - name: Build seed to release compiler
        env:
          WITH: ${{ github.workspace }}/src/main
        run: src/main build

      - name: Select rebuilt compiler
        run: echo "WITH=$GITHUB_WORKSPACE/out/release/bin/with" >> "$GITHUB_ENV"

      - name: Verify fixpoint
        run: ./out/release/bin/with build :fixpoint

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with version)" = "with $WITH_VERSION"
          cp out/release/bin/with "out/release/${{ matrix.release_asset }}"
          chmod +x "out/release/${{ matrix.release_asset }}"
          shasum -a 256 "out/release/${{ matrix.release_asset }}" > "out/release/${{ matrix.release_asset }}.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET" "out/release/$WITH_SDK_ASSET"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.sha256" "out/release/$WITH_SDK_ASSET.sha256"
          cp "$RUNNER_TEMP/$WITH_SDK_ASSET.manifest" "out/release/$WITH_SDK_ASSET.manifest"

      - name: Verify packaged checksums
        run: |
          shasum -a 256 -c "out/release/${{ matrix.release_asset }}.sha256"
          shasum -a 256 -c "out/release/$WITH_SDK_ASSET.sha256"

      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.platform }}-${{ github.sha }}
          path: |
            out/release/${{ matrix.release_asset }}
            out/release/${{ matrix.release_asset }}.sha256
            out/release/${{ matrix.sdk_asset }}
            out/release/${{ matrix.sdk_asset }}.sha256
            out/release/${{ matrix.sdk_asset }}.manifest
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Verify and package windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      # Native Windows self-host mirrors .github/workflows/selfhost-windows.yml:
      # the published Windows seed builds stage1 -> stage2 -> stage3, we assert
      # stage2 == stage3 (fixpoint), then package the fixpoint-verified with.exe.
      # The unix matrix build above cannot cover Windows -- its steps use shasum,
      # tar -xzf, libclang.a and POSIX paths -- so Windows is a sibling job.
      WITH_SEED_REPO: withlang-dev/with
      # ae12ec95 carries the rt_getenv deadlock fix (rt_mmap return buffer). Older
      # pins self-deadlocked under `build` at the allocator's WITH_MEMORY_LIMIT_BYTES
      # cold-read (rt_getenv -> with_alloc re-entering the non-recursive spinlock).
      WITH_SEED_VERSION: seed-windows-x86_64-ae12ec95
      WITH_SEED_ASSET: with-windows-x86_64.exe
      WITH_SEED_SHA256: 6d604a38fa487de416ee68729b61e56543eecc0ff6ffe1277fbcdf8f55466f80
      # The Windows LLVM SDK is versioned independently of the nightly-sdk-* used
      # by darwin/linux and ships without .sha256/.manifest sidecars, so we pin the
      # archive digest directly here rather than fetching sidecar files.
      WITH_SDK_REPO: withlang-dev/with
      WITH_SDK_VERSION: v0.15.1
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-windows-x86_64.tar.zst
      WITH_SDK_SHA256: 0c4f9860cf528b3821781d89e5b42947ef8ee2249327cffa64fb9fb5eac09a4a
      # windows-latest is a 4-vCPU runner; pin the worker pool to the real core
      # count (the seed's rt_sysinfo reads the wrong SYSTEM_INFO offset, which would
      # otherwise oversubscribe the pool). Honoured before the core probe.
      WITH_BUILD_JOBS: "4"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release version
        run: test "$(tr -d '\r\n' < src/version)" = "$WITH_VERSION"

      - name: Fetch verified Windows LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          # git-bash GNU tar treats "D:\..." as host:path (the drive colon looks
          # like host:path), so keep the archive on an msys path.
          sdk="$(cygpath -u "$RUNNER_TEMP")/sdk.tar.zst"
          curl -fL -o "$sdk" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          printf '%s  %s\n' "$WITH_SDK_SHA256" "$sdk" | sha256sum -c -
          tar --zstd -xf "$sdk" -C .deps
          prefix=".deps/llvm-22.1.6-windows-x86_64-msvc"
          test -f "$prefix/lib/libclang.lib" || { echo "SDK libclang.lib missing"; exit 1; }
          test -f "$prefix/bin/lld-link.exe" || { echo "SDK lld-link.exe missing"; exit 1; }

      - name: Fetch verified Windows seed
        run: |
          set -euo pipefail
          curl -fL -o src/main.exe \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main.exe | sha256sum -c -
          ./src/main.exe version

      - name: Configure native toolchain env
        run: |
          set -euo pipefail
          # The compiler and every child link process are native Windows exes, so
          # they need Windows-form paths (cygpath -m keeps forward slashes, which
          # both the file APIs and lld-link accept).
          echo "WITH=$(cygpath -m "$PWD/src/main.exe")" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(cygpath -m "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc")" >> "$GITHUB_ENV"
          # MSVC CRT + Windows SDK import libs (Link.w reads WITH_WINDOWS_{MSVC,UCRT,UM}_LIBDIR).
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs_root="$(cygpath -u "$("$vswhere" -latest -products '*' -property installationPath)")"
          msvc_ver="$(ls "$vs_root/VC/Tools/MSVC" | sort -V | tail -1)"
          echo "WITH_WINDOWS_MSVC_LIBDIR=$(cygpath -m "$vs_root/VC/Tools/MSVC/$msvc_ver/lib/x64")" >> "$GITHUB_ENV"
          kit_root="/c/Program Files (x86)/Windows Kits/10/Lib"
          kit_ver="$(ls "$kit_root" | sort -V | tail -1)"
          echo "WITH_WINDOWS_UCRT_LIBDIR=$(cygpath -m "$kit_root/$kit_ver/ucrt/x64")" >> "$GITHUB_ENV"
          echo "WITH_WINDOWS_UM_LIBDIR=$(cygpath -m "$kit_root/$kit_ver/um/x64")" >> "$GITHUB_ENV"
          echo "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc/bin" >> "$GITHUB_PATH"

      - name: Build seed to release compiler
        run: ./src/main.exe build

      - name: Verify fixpoint
        run: ./src/main.exe build :fixpoint

      - name: Package fixpoint-verified release asset
        run: |
          set -euo pipefail
          test "$(./out/release/bin/with.exe version)" = "with $WITH_VERSION"
          cp out/release/bin/with.exe out/release/with-windows-x86_64.exe
          sha256sum out/release/with-windows-x86_64.exe > out/release/with-windows-x86_64.exe.sha256

      - name: Verify packaged checksum
        run: sha256sum -c out/release/with-windows-x86_64.exe.sha256

      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-windows-x86_64-${{ github.sha }}
          path: |
            out/release/with-windows-x86_64.exe
            out/release/with-windows-x86_64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish immutable release
    needs: [build, build-windows]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      # The metadata generator is With-native. Reuse the verified Linux output
      # when Linux succeeds; otherwise these pins provision a metadata-only
      # compiler and SDK without adding Linux assets to the partial release.
      METADATA_SEED_REPO: withlang-dev/with
      METADATA_SEED_VERSION: seed-linux-tip-368c81bf
      METADATA_SEED_ASSET: with-linux-x86_64
      METADATA_SEED_SHA256: bd3a76844f23f9ecbe23cc1a4138087bd80ece2df41db2408e59a60b180c2019
      METADATA_SDK_REPO: withlang-dev/with
      METADATA_SDK_VERSION: nightly-sdk-test-20260815-680aa139
      METADATA_SDK_ASSET: with-llvm-sdk-22.1.6-linux-x86_64.tar.gz
      METADATA_SDK_SHA256: c7747403c3556ba9ca6e8f47c5db023798c7c5828c807c4a3b474f0c87db24db
    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-*-${{ github.sha }}
          path: out/release
          merge-multiple: true

      - name: Select and verify successful platform artifacts
        id: artifacts
        run: |
          set -euo pipefail
          assets_file="$RUNNER_TEMP/nightly-release-assets.txt"
          : > "$assets_file"
          platforms=""

          require_asset() {
            local asset="$1"
            test -f "out/release/$asset" || {
              echo "incomplete platform artifact set: missing $asset" >&2
              exit 1
            }
            printf '%s\n' "out/release/$asset" >> "$assets_file"
          }

          append_platform() {
            if [ -n "$platforms" ]; then
              platforms="$platforms, "
            fi
            platforms="$platforms$1"
          }

          if [ -e out/release/with-darwin-aarch64 ] ||
             [ -e out/release/with-darwin-aarch64.sha256 ]; then
            require_asset with-darwin-aarch64
            require_asset with-darwin-aarch64.sha256
            require_asset with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz
            require_asset with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.sha256
            require_asset with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.manifest
            shasum -a 256 -c out/release/with-darwin-aarch64.sha256
            shasum -a 256 -c out/release/with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.sha256
            append_platform darwin-aarch64
          fi

          if [ -e out/release/with-linux-x86_64 ] ||
             [ -e out/release/with-linux-x86_64.sha256 ]; then
            require_asset with-linux-x86_64
            require_asset with-linux-x86_64.sha256
            require_asset with-llvm-sdk-22.1.6-linux-x86_64.tar.gz
            require_asset with-llvm-sdk-22.1.6-linux-x86_64.tar.gz.sha256
            require_asset with-llvm-sdk-22.1.6-linux-x86_64.tar.gz.manifest
            shasum -a 256 -c out/release/with-linux-x86_64.sha256
            shasum -a 256 -c out/release/with-llvm-sdk-22.1.6-linux-x86_64.tar.gz.sha256
            append_platform linux-x86_64
          fi

          if [ -e out/release/with-windows-x86_64.exe ] ||
             [ -e out/release/with-windows-x86_64.exe.sha256 ]; then
            require_asset with-windows-x86_64.exe
            require_asset with-windows-x86_64.exe.sha256
            shasum -a 256 -c out/release/with-windows-x86_64.exe.sha256
            append_platform windows-x86_64
          fi

          test -s "$assets_file" || {
            echo "no verified platform artifact set succeeded; refusing an empty release" >&2
            exit 1
          }
          printf 'assets_file=%s\n' "$assets_file" >> "$GITHUB_OUTPUT"
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: out/release/with-*

      - name: Generate immutable release metadata
        id: release
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          SUCCESSFUL_PLATFORMS: ${{ steps.artifacts.outputs.platforms }}
        run: |
          set -euo pipefail
          # Native `with run` delegates to `cc -fuse-ld=lld`.
          metadata_with="out/release/with-linux-x86_64"
          if [ ! -f "$metadata_with" ]; then
            metadata_with="$RUNNER_TEMP/nightly-metadata-with"
            curl -fL -o "$metadata_with" \
              "https://github.com/$METADATA_SEED_REPO/releases/download/$METADATA_SEED_VERSION/$METADATA_SEED_ASSET"
            printf '%s  %s\n' "$METADATA_SEED_SHA256" "$metadata_with" | shasum -a 256 -c -
          fi
          chmod +x "$metadata_with"

          metadata_sdk_archive="out/release/$METADATA_SDK_ASSET"
          if [ ! -f "$metadata_sdk_archive" ]; then
            metadata_sdk_archive="$RUNNER_TEMP/$METADATA_SDK_ASSET"
            curl -fL -o "$metadata_sdk_archive" \
              "https://github.com/$METADATA_SDK_REPO/releases/download/$METADATA_SDK_VERSION/$METADATA_SDK_ASSET"
            printf '%s  %s\n' "$METADATA_SDK_SHA256" "$metadata_sdk_archive" | shasum -a 256 -c -
          fi
          metadata_sdk="$RUNNER_TEMP/nightly-metadata-sdk"
          mkdir -p "$metadata_sdk"
          tar -xzf "$metadata_sdk_archive" -C "$metadata_sdk"
          metadata_sdk_bin="$metadata_sdk/llvm-22.1.6-linux-x86_64/bin"
          ln -s clang "$metadata_sdk_bin/cc"
          export PATH="$metadata_sdk_bin:$PATH"
          test -x "$metadata_sdk_bin/cc"
          test -x "$metadata_sdk_bin/ld.lld"
          "$metadata_with" run tools/nightly_release_metadata.w \
            "$GITHUB_EVENT_NAME" \
            "$REQUESTED_CHANNEL" \
            "$(date -u +%Y%m%d)" \
            "$(date -u +%Y-%m-%d)" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$WITH_VERSION" \
            "$GITHUB_OUTPUT" \
            out/release/nightly-release-notes.md \
            "$SUCCESSFUL_PLATFORMS"

      - name: Create tag and release
        env:
          # Scheduled nightlies publish as the github-actions bot (github.token);
          # this needs the repo's default workflow permissions set to
          # "Read and write" (and, if a tag ruleset guards v*/nightly-*, the
          # Actions bot on its bypass list). Manual dispatches publish with a
          # release-capable PAT (RELEASE_TOKEN, e.g. ropoctl) — the bot cannot
          # create releases here (POST /releases 403s), and ropoctl provably can.
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_ASSETS_FILE: ${{ steps.artifacts.outputs.assets_file }}
        run: |
          set -euo pipefail
          mapfile -t release_assets < "$RELEASE_ASSETS_FILE"
          test "${#release_assets[@]}" -gt 0
          release_flags=()
          if [ "$RELEASE_CHANNEL" != release ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file out/release/nightly-release-notes.md \
            "${release_flags[@]}"

      - name: Verify published tag, assets, and digest
        env:
          # Verify as the same actor that created the release (reads work with
          # either token; keeping them identical avoids any create/read actor
          # skew across the schedule vs manual-dispatch paths).
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSETS_FILE: ${{ steps.artifacts.outputs.assets_file }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_sha" = "$GITHUB_SHA"
          published_prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [ "$RELEASE_CHANNEL" = release ]; then
            test "$published_prerelease" = false
          else
            test "$published_prerelease" = true
          fi
          while IFS= read -r asset_path; do
            asset="${asset_path##*/}"
            checksum_line="$(shasum -a 256 "$asset_path")"
            expected="${checksum_line%% *}"
            published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")"
            test "$published" = "sha256:$expected"
          done < "$RELEASE_ASSETS_FILE"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isPrerelease,targetCommitish,assets
