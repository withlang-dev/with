name: windows x86_64

on:
  # Lanes run nightly and on request; never on a push or a PR (D56, Eric
  # 2026-09-22: CI was overzealous in what it did on every push). A lane
  # takes hours on a 4-core runner (compiler build, fixpoint, battery), so
  # it is not a merge signal: the seed-driven battery on the maintainer
  # machine gates a PR and is posted on it. The SDK is built only on
  # release (sdk-release.yml), never here.
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

# Never cancel a run: it is the evidence for that night's main.
# Hardcode the platform token (not ${{ github.workflow }}) so a workflow
# rename can never merge two platforms into one group and cancel each
# other.
concurrency:
  group: selfhost-tests-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  selfhost-windows:
    name: windows x86_64
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Native Windows self-host: the published Windows seed compiler builds
      # stage1 -> stage2 -> stage3 and we assert stage2 == stage3 (fixpoint).
      WITH_SEED_REPO: withlang-dev/with
      # Seed from a released, versioned asset -- never a hand-cut
      # seed-windows-x86_64-<sha> release (those are unapproved manual uploads).
      # v0.15.1.4's with-windows-x86_64.exe is CI-produced by the nightly-release
      # workflow from post-#806 main, so it carries the win64 aggregate-return ABI
      # fix. The old v0.15.1.3 seed predated that fix; a compiler bootstrapped from
      # it self-perpetuates the miscompile and crashes (0xC0000005) compiling any
      # regex literal at comptime. build/:fixpoint never compile a regex, so that
      # poison shipped green -- but it reds this job's battery the moment #798/#825
      # un-skip the regex tests. The regex smoke-test step below is the backstop.
      WITH_SEED_VERSION: nightly-20261005-local-1-3207aacb2c74
      WITH_SEED_ASSET: with-windows-x86_64.exe
      WITH_SEED_SHA256: 699bba4b9276cdc26bad8525796df9adb52a67a46b84400c3655c4351f50320d
      WITH_SDK_REPO: withlang-dev/with
      # The windows-gnu SDK of sdk.lock (#1915): its own C runtime, so the
      # lane reads no Visual Studio and no Windows SDK.
      WITH_SDK_VERSION: nightly-sdk-20260930-6cd934e82b4d
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-windows-x86_64.tar.gz
      # windows-latest is a 4-vCPU runner. The build worker pool sizes itself
      # from the CPU count; pin it to the real core count so the pool does not
      # oversubscribe. The seed's rt_sysinfo reads the wrong SYSTEM_INFO offset
      # (dwProcessorType ~8664 instead of dwNumberOfProcessors), which would size
      # the pool 16-wide on a 4-vCPU runner -> 4x oversubscription/thrash (not the
      # startup hang above, which was the rt_getenv deadlock). build_pool_width
      # honours this env before the core probe, so it takes effect on the frozen
      # seed with no reseed.
      WITH_BUILD_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Windows LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          # git-bash GNU tar treats a "D:\..." path as a remote host (the drive
          # colon looks like host:path), so keep the archive on a msys path.
          sdk="$(cygpath -u "$RUNNER_TEMP")/sdk.tar.gz"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$sdk" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$sdk.sha256" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.sha256"
          printf '%s  %s\n' "$(cut -d' ' -f1 "$sdk.sha256")" "$sdk" | sha256sum -c -
          tar -xzf "$sdk" -C .deps
          prefix=".deps/llvm-22.1.6-windows-x86_64-msvc"
          test -f "$prefix/lib/libclang.a" || { echo "SDK libclang.a missing"; ls -la "$prefix/lib" | head; exit 1; }
          test -f "$prefix/libc/windows/include/stdio.h" || { echo "SDK C runtime missing"; exit 1; }
          test -f "$prefix/bin/lld-link.exe" || { echo "SDK lld-link.exe missing"; ls -la "$prefix/bin" | head; exit 1; }

      - name: Fetch Windows seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o src/main.exe \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main.exe | sha256sum -c -
          ./src/main.exe version

      - name: Configure native toolchain env
        run: |
          set -euo pipefail
          # The compiler and every child link process are native Windows exes, so
          # they need Windows-form paths (cygpath -m keeps forward slashes, which
          # both the file APIs and lld-link accept). Bash file ops keep msys paths.

          # Seed resolution (build/compiler.w comp_resolve_seed_compiler) reads WITH
          # and spawns it with CreateProcessW.
          echo "WITH=$(cygpath -m "$PWD/src/main.exe")" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(cygpath -m "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc")" >> "$GITHUB_ENV"

          # lld-link.exe on PATH for the native COFF link step.
          echo "$PWD/.deps/llvm-22.1.6-windows-x86_64-msvc/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          set -euo pipefail
          echo "WITH=$WITH"
          echo "LLVM_PREFIX=$LLVM_PREFIX"
          command -v lld-link.exe && lld-link.exe --version || true

      - name: Build (seed -> stage1 -> stage2 -> stage3)
        # WITH_PROFILE: every stage's compiler prints each phase to stderr as
        # it completes, so a stage that hangs (stage2, 1801 s on #1129) leaves
        # its last finished phase in out/command/<stage>/stderr.txt.
        run: WITH_PROFILE=1 ./src/main.exe build

      - name: WebAssembly fixtures
        run: ./src/main.exe build :wasm-tests

      - name: Fixpoint (stage2 == stage3)
        run: ./src/main.exe build :fixpoint

      - name: Green battery (build :test)
        run: |
          set -euo pipefail
          # The standing Windows green battery. `:test` runs the behavior,
          # native, comptime-diff, debug-alloc, internals, deep-debug-tool, CLI
          # self-host and c-migrator suites, then records `test-green` evidence.
          # It is driven with the seed (WITH) for the same reason as build /
          # fixpoint above: build.w's test actions invoke the already-built
          # out/release/bin/with on the fixtures (no rebuild — the build step
          # populated the cache).
          #
          # Tests that cannot pass natively on Windows yet are gated in-source
          # with `//! skip-windows: <reason>` (e.g. behav_async_stack_overflow,
          # which needs a native Windows fiber backend / VEH guard-page trap,
          # #369). This is the lazy per-test gate the harness already supports;
          # a general target_os predicate is proposed separately. As each
          # underlying gap is fixed the skip is removed, greening more of the
          # battery over time.
          ./src/main.exe build :test

      - name: Stage diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "== out/command/stage2 captures"
          for f in out/command/stage2/stdout.txt out/command/stage2/stderr.txt out/command/stage1/stderr.txt; do
            [ -f "$f" ] || continue
            echo "== $f ($(wc -l < "$f") lines)"; tail -60 "$f"
          done
          if [ -x out/bootstrap/bin/with-stage1.exe ]; then
            echo "== probe: stage1 check src/main.w (Sema/MIR only, 900 s)"
            timeout 900 ./out/bootstrap/bin/with-stage1.exe check src/main.w > out/probe-check.stdout 2> out/probe-check.stderr; echo "check rc=$?"
            tail -20 out/probe-check.stderr
            echo "== probe: stage1 build out/gen/main.w with one codegen unit (1500 s)"
            WITH_CODEGEN_UNITS=1 WITH_PROFILE=1 timeout 1500 ./out/bootstrap/bin/with-stage1.exe build out/gen/main.w -O1 -o out/probe-single.exe > out/probe-single.stdout 2> out/probe-single.stderr; echo "single-unit build rc=$?"
            tail -40 out/probe-single.stderr
          fi

      - name: Upload test captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-captures
          path: |
            out/command/**
            out/probe-*.std*
            out/test-graph/**
            out/tmp/pre-d-p7-capture/**
            out/tmp/pre-d-p7/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload native stage2 for local repro on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-stage2
          path: |
            out/stage/bin/with-stage2.exe
            out/release/bin/with.exe
          if-no-files-found: ignore
          retention-days: 7
