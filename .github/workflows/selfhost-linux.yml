name: linux x86_64

on:
  # Lanes run nightly and on request; never on a push or a PR (D56, Eric
  # 2026-09-22: CI was overzealous in what it did on every push). A lane
  # takes hours on a 4-core runner (compiler build, fixpoint, battery), so
  # it is not a merge signal: the seed-driven battery on the maintainer
  # machine gates a PR and is posted on it. The SDK is built only on
  # release (sdk-release.yml), never here.
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:

# Never cancel a run: it is the evidence for that night's main.
# Hardcode the platform token (not ${{ github.workflow }}) so a workflow
# rename can never merge two platforms into one group and cancel each
# other.
concurrency:
  group: selfhost-tests-linux-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  selfhost-linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    # The full battery (seed bootstrap + build + fixpoint + :test) is longer than
    # the bare self-host check; give it headroom on the shared runner.
    timeout-minutes: 360
    env:
      WITH_OUT_DIR: ${{ github.workspace }}/out
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-linux-x86_64
      # Fixpoint-verified stable release seed for this platform.
      WITH_SEED_REPO: withlang-dev/with
      WITH_SEED_ASSET: with-linux-x86_64
      WITH_SEED_VERSION: nightly-20260926-local-1-2e8defaa18ef
      WITH_SEED_SHA256: ce5c3c4729650b215fb166ac8078fe7c7982b094bc4a1e31401e04eb7e7460d0
      WITH_SDK_REPO: withlang-dev/with
      # Built from build/sdk.w at main 2e8defaa + the llvm-dwarfdump fix: the
      # WebAssembly backend (#1210) and llvm-dwarfdump (stage2-debug-lines),
      # which the v0.15.1 SDK lacks.
      WITH_SDK_VERSION: nightly-20260926-local-1-2e8defaa18ef
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-linux-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # zstd: extract the SDK tarball. dev libs: the compiler link line uses
          # -lz -lzstd -lxml2 (build/compiler.w), which need the .so dev symlinks.
          sudo apt-get install -y --no-install-recommends zstd zlib1g-dev libzstd-dev libxml2-dev

      - name: Fetch LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/sdk.tar.gz \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/sdk.tar.gz.sha256 \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET.sha256"
          printf '%s  %s\n' "$(cut -d' ' -f1 /tmp/sdk.tar.gz.sha256)" /tmp/sdk.tar.gz | sha256sum -c -
          tar -xzf /tmp/sdk.tar.gz -C .deps
          test -d "$LLVM_PREFIX/bin" || { echo "unexpected SDK layout"; ls -la .deps; exit 1; }
          test -x "$LLVM_PREFIX/bin/lld" || { echo "SDK lld missing"; exit 1; }

      - name: Set up linker shim (SDK lld + libxml2.so.16)
        run: |
          set -euo pipefail
          mkdir -p .link-shim
          # The seed emits -fuse-ld=lld; expose the SDK's lld under the names the
          # driver looks for. SDK lld has DT_NEEDED libxml2.so.16 while Ubuntu
          # ships libxml2.so.2 — ABI-safe for linking (ELF link never calls into
          # libxml2), so alias it.
          ln -sf "$LLVM_PREFIX/bin/ld.lld" .link-shim/ld.lld
          ln -sf "$LLVM_PREFIX/bin/ld.lld" .link-shim/ld64.lld
          ln -sf "$LLVM_PREFIX/bin/lld"    .link-shim/lld
          xml2="$(ldconfig -p | awk '/libxml2\.so\.2 /{print $NF; exit}')"
          [ -n "$xml2" ] || xml2="$(ls /lib/x86_64-linux-gnu/libxml2.so.2* 2>/dev/null | head -1)"
          [ -n "$xml2" ] || { echo "no system libxml2.so.2"; exit 1; }
          ln -sf "$xml2" .link-shim/libxml2.so.16
          # Verify lld runs — it needs the aliased libxml2.so.16 on the search
          # path, so point LD_LIBRARY_PATH at the shim (as the build steps do).
          LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}" "$LLVM_PREFIX/bin/ld.lld" --version

      - name: Bootstrap seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o with-seed \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" with-seed | sha256sum -c -
          chmod +x with-seed
          LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}" ./with-seed version

      - name: Build (seed -> stage1 -> stage2 -> final)
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          export PATH="$PWD/.link-shim:$LLVM_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}"
          "$WITH" build

      - name: WebAssembly fixtures
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}" ./with-seed build :wasm-tests

      - name: Fixpoint (stage2.emit == stage3.emit)
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          # Drive the build graph with the pinned stable seed; the graph compares
          # the newly built stage2 and stage3 compiler outputs.
          export PATH="$PWD/.link-shim:$LLVM_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}"
          "$WITH" build :fixpoint

      - name: Green battery (build :test — behavior/native/cli/deep-debug/alloc + audit:all)
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          # The standing green battery. `:test` is a Group target that runs the
          # behavior, native compile-error/codegen/spec/phase, comptime-diff,
          # debug-alloc, lexer/parser/internals, deep-debug-tool (which itself
          # asserts `analyze audit:all` + `audit:storage`), CLI self-host, and
          # c-migrator suites, then records `test-green` evidence.
          #
          # The stable seed runs build.w, whose test actions invoke the already-
          # built out/release/bin/with on the fixtures (no rebuild — the build
          # step above populated the cache).
          export PATH="$PWD/.link-shim:$LLVM_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}"
          "$WITH" build :test

      - name: Upload test captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-test-captures
          path: |
            out/test-graph/**
            out/tmp/pre-d-p7-capture/**
            out/tmp/pre-d-p7/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native stage2 for local repro on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-native-stage2
          path: out/stage/bin/with-stage2
          if-no-files-found: warn
          retention-days: 7
