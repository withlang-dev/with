name: macOS arm64

on:
  # Restrict push to main so a PR-branch push does not trigger BOTH a push run
  # and a pull_request run (the double-run that doubles runner usage). PRs are
  # covered by pull_request; main pushes (merges) by push.
  push:
    branches: [main]
  pull_request:

# Cancel a superseded in-progress run when the same PR branch is re-pushed.
# Hardcode the platform token (not ${{ github.workflow }}) so a workflow
# rename can never merge two platforms into one group and cancel each
# other.
concurrency:
  group: selfhost-tests-macos-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  selfhost-macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      WITH_OUT_DIR: ${{ github.workspace }}/out
      WITH: ${{ github.workspace }}/src/main
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap seed
        env:
          WITH_SEED_REPO: withlang-dev/with
          WITH_SEED_VERSION: v0.15.2.0
          WITH_SEED_ASSET: with-darwin-aarch64
          WITH_SEED_SHA256: 79a63ff91d5d9260463adf3e08ff43bdd5446d070eac2ca56ef543ae05484075
        run: |
          set -euo pipefail
          curl -fL -o src/main \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" src/main | shasum -a 256 -c -
          chmod +x src/main
          src/main version

      # The static LLVM SDK that `build :deps` fetches is published as a per-
      # platform release asset. The build tree currently expects a `.tar.gz`
      # asset (self-hosted zlib_gunzip in `run_deps_download_action`), but every
      # release published so far ships the SDK only as `.tar.zst`. Until a
      # release is cut with `.tar.gz` assets, `build :deps` cannot find its
      # asset and the build fails. Provision `.deps/` directly here, preferring
      # the correct `.tar.gz` and falling back to the `.tar.zst` that shipped in
      # the last release, so `build :deps` finds its marker already present and
      # succeeds without changing the self-hosted fetch path.
      - name: Provision LLVM SDK (bridge .tar.gz/.tar.zst release skew)
        env:
          GH_TOKEN: ${{ github.token }}
          WITH_SDK_REPO: withlang-dev/with
        run: |
          set -euo pipefail
          prefix="$LLVM_PREFIX"
          if [ -f "$prefix/lib/libclang.a" ]; then
            echo "SDK already provisioned at $prefix"
            exit 0
          fi
          # Derive "<ver>" and the darwin-aarch64 asset base from the prefix dir
          # name (.deps/llvm-<ver>-darwin-arm64).
          dir="$(basename "$prefix")"        # llvm-<ver>-darwin-arm64
          ver="${dir#llvm-}"; ver="${ver%-darwin-arm64}"
          base="with-llvm-sdk-${ver}-darwin-aarch64"
          asset=""; tag=""
          # Newest release first; within a release prefer .tar.gz over .tar.zst.
          while IFS= read -r candidate; do
            names="$(gh release view "$candidate" --repo "$WITH_SDK_REPO" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$names" | grep -qx "${base}.tar.gz"; then
              asset="${base}.tar.gz"; tag="$candidate"; break
            fi
            if printf '%s\n' "$names" | grep -qx "${base}.tar.zst"; then
              asset="${base}.tar.zst"; tag="$candidate"; break
            fi
          done < <(gh release list --repo "$WITH_SDK_REPO" --limit 50 --json tagName --jq '.[].tagName')
          if [ -z "$asset" ]; then
            echo "error: no release publishes ${base}.tar.gz or ${base}.tar.zst" >&2
            exit 1
          fi
          echo "provisioning SDK from $tag: $asset"
          mkdir -p .deps
          curl -fL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/$WITH_SDK_REPO/releases/download/$tag/$asset"
          case "$asset" in
            *.tar.gz)  tar -xzf "$RUNNER_TEMP/$asset" -C .deps ;;
            *.tar.zst)
              if tar --help 2>&1 | grep -q -- --zstd; then
                tar --zstd -xf "$RUNNER_TEMP/$asset" -C .deps
              else
                zstd -d -c "$RUNNER_TEMP/$asset" | tar -xf - -C .deps
              fi ;;
          esac
          test -f "$prefix/lib/libclang.a"
          echo "SDK provisioned at $prefix"

      - name: Fetch SDK
        run: src/main build :deps

      - name: Build
        env:
          WITH_PROFILE: "1"
        run: src/main build

      - name: Fixpoint
        env:
          WITH_PROFILE: "1"
        run: ./out/release/bin/with build :fixpoint

      - name: Green battery (build :test)
        run: src/main build :test

      # A stage timeout keeps its compiler captures. Preserve those profiles
      # as well as test captures so a build failure identifies its last phase.
      - name: Upload compiler and test captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-captures
          path: |
            out/command/**
            out/.build-state/build-times.tsv
            out/test-graph/**
            out/corpus/**/stdout.txt
            out/corpus/**/stderr.txt
          if-no-files-found: warn

      # A failed test keeps its capture files (the runner removes them only
      # on success), but the seed that drives this step predates the
      # runner's stderr tail, so the log names the files and shows nothing.
      # Dump every surviving capture, and probe the stage2 binary the
      # behavior tests and selfcheck prefer, so a runner-only failure is
      # diagnosable from the log (two macOS-only failures of #1101 were not).
      - name: Failure diagnostics
        if: failure()
        run: |
          set +e
          echo "== out/stage/bin and out/release/bin"
          ls -la out/stage/bin out/release/bin 2>&1
          echo "== stage2 probe"
          ./out/stage/bin/with-stage2 version; echo "rc=$?"
          ./out/stage/bin/with-stage2 check src/main.w >/dev/null 2>out/stage2-selfcheck.stderr; echo "check rc=$?"
          tail -40 out/stage2-selfcheck.stderr 2>/dev/null
          for f in out/test-graph/*/*.stdout out/test-graph/*/*.stderr out/corpus/*/stdout.txt out/corpus/*/stderr.txt out/command/*/*.stdout out/command/*/*.stderr out/tmp/pre-d-p7-capture/*/*.txt; do
            [ -f "$f" ] || continue
            echo "== $f ($(wc -l < "$f") lines)"
            tail -60 "$f"
          done
