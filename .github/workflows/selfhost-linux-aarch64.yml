name: linux aarch64

on:
  # Lanes run nightly and on request; never on a push or a PR (D56, Eric
  # 2026-09-22: CI was overzealous in what it did on every push). A lane
  # takes hours on a 4-core runner (compiler build, fixpoint, battery), so
  # it is not a merge signal: the seed-driven battery on the maintainer
  # machine gates a PR and is posted on it. The SDK is built only on
  # release (sdk-release.yml), never here.
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

# Never cancel a run: it is the evidence for that night's main.
# Hardcode the platform token (not ${{ github.workflow }}) so a workflow
# rename can never merge two platforms into one group and cancel each
# other.
concurrency:
  group: selfhost-tests-linux-aarch64-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  selfhost-linux-aarch64:
    name: linux aarch64
    runs-on: ubuntu-24.04-arm
    # Self-host + fixpoint only; give it headroom on the shared ARM runner.
    timeout-minutes: 360
    env:
      WITH_OUT_DIR: ${{ github.workspace }}/out
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-linux-aarch64
      # The seed.lock pin (#1915, D81): a self-contained compiler that embeds
      # its runtime objects, the glibc 2.28 sysroot, libc++ and lld, so the
      # lane needs no runtime bundle, linker shim, host libxml2 or host gcc.
      WITH_SEED_REPO: withlang-dev/with
      WITH_SEED_ASSET: with-linux-aarch64
      WITH_SEED_VERSION: nightly-20261003-local-2-b78ceca2d3c5
      WITH_SEED_SHA256: c5b434ce739a0ef2a8beddf09abd30f1f501aa2b9227b07a0b16bdf65f8f2898
      WITH_SDK_REPO: withlang-dev/with
      WITH_SDK_VERSION: nightly-sdk-20260930-e997223d40ce
      WITH_SDK_ASSET: with-llvm-sdk-22.1.6-linux-aarch64.tar.gz
      WITH_SDK_SHA256: 4fe9695ef30a05d2f15bd0095b2d8b892ae9102930ca520b382ab545a3727a2b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # bz2, sqlite3, curl: the facade tests c_import the host's bzlib.h,
          # sqlite3.h and curl/curl.h (a UAT project gets them from `with get`).
          # bubblewrap: the :no-host-toolchain sandbox. The compiler itself
          # links nothing of the host.
          sudo apt-get install -y --no-install-recommends libbz2-dev libsqlite3-dev \
            libcurl4-openssl-dev bubblewrap

      - name: Fetch LLVM SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/sdk.tar.gz \
            "https://github.com/$WITH_SDK_REPO/releases/download/$WITH_SDK_VERSION/$WITH_SDK_ASSET"
          printf '%s  %s\n' "$WITH_SDK_SHA256" /tmp/sdk.tar.gz | sha256sum -c -
          tar -xzf /tmp/sdk.tar.gz -C .deps
          test -d "$LLVM_PREFIX/bin" || { echo "unexpected SDK layout"; ls -la .deps; exit 1; }
          test -x "$LLVM_PREFIX/bin/lld" || { echo "SDK lld missing"; exit 1; }

      - name: Bootstrap seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o with-seed \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" with-seed | sha256sum -c -
          chmod +x with-seed
          ./with-seed version
          # Prove the seed can actually link before spending a full build on it.
          printf 'fn main:\n    print("seed links")\n' > /tmp/seedcheck.w
          ./with-seed run /tmp/seedcheck.w

      - name: Build (seed -> stage1 -> stage2 -> final)
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: ./with-seed build

      - name: WebAssembly fixtures
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: ./with-seed build :wasm-tests

      - name: Fixpoint (stage2.emit == stage3.emit)
        env:
          WITH: ${{ github.workspace }}/with-seed
        # Drive the build graph with the pinned seed; the graph compares the
        # newly built stage2 and stage3 compiler outputs.
        run: ./with-seed build :fixpoint

      - name: No host toolchain
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: ./with-seed build :no-host-toolchain

      # NOTE: the `build :test` green battery is deliberately NOT run here yet
      # (#1149). On linux-aarch64 it fails 8 target groups (behavior-tests 7 of
      # 948 files, the three cli-selfhost suites, both c-migrator suites,
      # embedded-runtime-regression, emit-c-smoke) while build and fixpoint are
      # green. #1149 fixes those and adds `src/main build :test` here, so this
      # platform matches the other selfhost workflows.
