name: Ceremony census

on:
  # Every pull request (Eric, 2026-11-25): new ceremony does not merge unseen.
  # This is not a lane. The pinned seed runs tools/ceremony_census.with over
  # the files the pull request changes, file by file, and nothing is built
  # (D56 stands for builds and tests: the battery on the maintainer machine
  # gates those).
  pull_request:

permissions:
  contents: read

jobs:
  census:
    name: No new ceremony
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WITH_SEED_REPO: withlang-dev/with
      WITH_SEED_ASSET: with-linux-x86_64
      WITH_SEED_VERSION: nightly-20261122-45071765995-1-8a5befa0e423
      WITH_SEED_SHA256: b35792d0196d11b69f487c9c20c95aa2d1c1c64c333957545bd240961f838245
    steps:
      - name: Check out the pull request merged into its base
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch the base
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Bootstrap seed
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o with-seed \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" with-seed | sha256sum -c -
          chmod +x with-seed
          ./with-seed version

      - name: Census of the changed files
        run: ./with-seed run tools/ceremony_census.with --diff "origin/${{ github.base_ref }}"
