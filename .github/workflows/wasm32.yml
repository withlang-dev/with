name: wasm32

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wasm32-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  wasm32-hello:
    name: wasm32 hello world (linux x86_64, node)
    runs-on: ubuntu-latest
    # A cold run builds the LLVM SDK (about two hours on the shared runner);
    # a cache hit brings the lane down to the compiler build plus the fixtures.
    timeout-minutes: 360
    env:
      WITH_OUT_DIR: ${{ github.workspace }}/out
      LLVM_VERSION: 22.1.6
      LLVM_PREFIX: ${{ github.workspace }}/.deps/llvm-22.1.6-linux-x86_64
      WITH_SEED_REPO: withlang-dev/with
      WITH_SEED_ASSET: with-linux-x86_64
      WITH_SEED_VERSION: v0.15.2.0
      WITH_SEED_SHA256: eaa955602fd96e960ea3cfcb2f41be4013380dce646e45a93422d67ce9003869
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # clang/lld/cmake/ninja build the SDK; the dev libs are on the
          # compiler's link line (-lz -lzstd -lxml2, build/compiler.w).
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build zlib1g-dev libzstd-dev libxml2-dev

      # The published static LLVM SDK is built for AArch64+X86 only; a wasm32
      # link needs the WebAssembly backend and wasm-ld. Build the SDK here
      # with the repository's own script (WebAssembly is its default target
      # set now) and cache the installed prefix, keyed on the script.
      - name: Restore LLVM SDK with the WebAssembly backend
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .deps/llvm-22.1.6-linux-x86_64
          key: llvm-sdk-wasm-linux-x86_64-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/build-static-llvm.sh') }}-v1

      - name: Build LLVM SDK with the WebAssembly backend
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          HOST_TAG: linux-x86_64
          SDK_CMAKE: /usr/bin/cmake
          SDK_NINJA: /usr/bin/ninja
          LLVM_TARGETS_TO_BUILD: "AArch64;X86;WebAssembly"
          PARALLEL_JOBS: "4"
        run: |
          set -euo pipefail
          # The build tree is far larger than the workspace disk; keep it on
          # the runner's big scratch volume and install into the workspace.
          sudo mkdir -p /mnt/llvm && sudo chown "$(id -u):$(id -g)" /mnt/llvm
          export ROOT=/mnt/llvm
          export INSTALL_PREFIX="$LLVM_PREFIX"
          tools/build-static-llvm.sh
          # The SDK tool check wants cmake/ninja beside the SDK binaries.
          ln -sf /usr/bin/cmake "$LLVM_PREFIX/bin/cmake"
          ln -sf /usr/bin/ninja "$LLVM_PREFIX/bin/ninja"
          rm -rf /mnt/llvm/build /mnt/llvm/src

      - name: Verify SDK
        run: |
          set -euo pipefail
          test -f "$LLVM_PREFIX/lib/libclang.a"
          test -x "$LLVM_PREFIX/bin/wasm-ld"
          ls "$LLVM_PREFIX/lib" | grep -q WebAssembly
          "$LLVM_PREFIX/bin/wasm-ld" --version

      - name: Bootstrap seed
        run: |
          set -euo pipefail
          curl -fL -o with-seed \
            "https://github.com/$WITH_SEED_REPO/releases/download/$WITH_SEED_VERSION/$WITH_SEED_ASSET"
          printf '%s  %s\n' "$WITH_SEED_SHA256" with-seed | sha256sum -c -
          chmod +x with-seed
          ./with-seed version

      - name: Build compiler
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          export PATH="$LLVM_PREFIX/bin:$PATH"
          "$WITH" build

      - name: Build the wasm32 runtime
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          export PATH="$LLVM_PREFIX/bin:$PATH"
          "$WITH" build :cross-rt-wasm

      - name: Hello world under node
        run: |
          set -euo pipefail
          export PATH="$LLVM_PREFIX/bin:$PATH"
          node --version
          ./out/release/bin/with build --target=wasm32 test/wasm/wasm_hello.w -o out/hello.wasm
          ls -la out/hello.wasm out/hello.js
          out="$(node out/hello.js)"
          echo "stdout: $out"
          test "$out" = "hello from wasm"

      - name: wasm32 fixtures under node
        env:
          WITH: ${{ github.workspace }}/with-seed
        run: |
          set -euo pipefail
          export PATH="$LLVM_PREFIX/bin:$PATH"
          "$WITH" build :wasm-tests

      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-captures
          path: |
            out/command/**
            out/test-graph/**
            out/hello.wasm
            out/hello.js
          if-no-files-found: warn
          retention-days: 7
