name: sdk-llvm darwin-x86_64

# Builds the static LLVM/Clang/lld SDK for darwin-x86_64 (Intel macOS) from
# the pinned LLVM source (tools/build-static-llvm.sh) on a native Intel macOS
# runner (macos-13), then publishes it as a ropoctl prerelease asset
# `with-llvm-sdk-22.1.6-darwin-x86_64.tar.gz`.
#
# Prerequisite for cross-building a darwin-x86_64 `with` stage1 seed (the
# cross-compiler link statically links the target arch's libclang.a). The
# tarball extracts to `.deps/llvm-22.1.6-darwin-x86_64/`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sdk-darwin-x86_64.yml'

concurrency:
  group: sdk-darwin-x86_64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-sdk:
    name: build static LLVM SDK (darwin-x86_64)
    runs-on: macos-13   # macos-13 is the Intel (x86_64) hosted image
    timeout-minutes: 350
    env:
      LLVM_VER: 22.1.6
      HOST_TAG: darwin-x86_64
      RELEASE_TAG: sdk-darwin-x86_64
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm native arch
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "x86_64" || { echo "runner is not x86_64 (macos-13 is Intel)"; exit 1; }
          sysctl -n hw.ncpu
          df -h .

      - name: Install host toolchain
        run: |
          set -euo pipefail
          # Apple clang is the bootstrap C/C++ compiler; the SDK build's
          # -fuse-ld=lld needs ld.lld, and it needs ninja. cmake is preinstalled
          # on the macOS image.
          brew install ninja lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify tools
        run: |
          set -euo pipefail
          clang --version
          "$(brew --prefix lld)/bin/ld.lld" --version
          cmake --version
          ninja --version
          xcrun --sdk macosx --show-sdk-path

      - name: Build static LLVM SDK
        run: |
          set -euo pipefail
          export ROOT="$PWD/.deps"
          export HOST_TAG="$HOST_TAG"
          export LLVM_VERSION="$LLVM_VER"
          export LLVM_BOOTSTRAP_CC=clang
          export LLVM_BOOTSTRAP_CXX=clang++
          export LLVM_BOOTSTRAP_LD=ld.lld
          export SDK_CMAKE="$(command -v cmake)"
          export SDK_NINJA="$(command -v ninja)"
          export PARALLEL_JOBS="$(sysctl -n hw.ncpu)"
          time bash tools/build-static-llvm.sh

      - name: Verify SDK
        run: |
          set -euo pipefail
          prefix=".deps/llvm-${LLVM_VER}-${HOST_TAG}"
          test -f "$prefix/lib/libclang.a" || { echo "missing libclang.a"; exit 1; }
          test -d "$prefix/lib/clang/22/include" || { echo "missing clang builtin headers"; exit 1; }
          # See sdk-linux-aarch64.yml: pipe into `grep -q` + pipefail = SIGPIPE
          # false negative. Materialize the symbol table, then grep the file.
          "$prefix/bin/llvm-nm" -g "$prefix/lib/libclang.a" > /tmp/libclang.syms
          grep -q clang_createIndex /tmp/libclang.syms \
            || { echo "libclang.a missing clang_createIndex"; exit 1; }
          du -sh "$prefix"

      - name: Package asset
        run: |
          set -euo pipefail
          prefix="llvm-${LLVM_VER}-${HOST_TAG}"
          asset="with-llvm-sdk-${LLVM_VER}-${HOST_TAG}.tar.gz"
          tar -czf "$asset" -C .deps "$prefix"
          shasum -a 256 "$asset" | tee "$asset.sha256"
          ls -la "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish to ropoctl prerelease
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Static LLVM ${LLVM_VER} SDK (darwin-x86_64)" \
              --notes "CI-built static LLVM/Clang/lld SDK for darwin-x86_64 (Intel macOS). Extracts to .deps/llvm-${LLVM_VER}-darwin-x86_64/. Prerequisite for cross-building a darwin-x86_64 with stage1 seed."
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: with-llvm-sdk-darwin-x86_64
          path: |
            with-llvm-sdk-${{ env.LLVM_VER }}-${{ env.HOST_TAG }}.tar.gz
            with-llvm-sdk-${{ env.LLVM_VER }}-${{ env.HOST_TAG }}.tar.gz.sha256
          retention-days: 14
