name: Source-built WebAssembly SDK
description: Rebuild and package the native SDK, then use it for the compiler build
inputs:
  host-tag:
    required: true
    description: SDK host directory tag
runs:
  using: composite
  steps:
    - name: Restore source-built SDK artifact
      id: sdk-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          out/release/with-llvm-sdk-*.tar.gz*
          out/test-graph/sdk-contract-tests
        key: source-sdk-${{ inputs.host-tag }}-22.1.6-${{ hashFiles('build.w', 'build/*.w', 'lib/std/build.w', 'lib/std/zl/*.w', 'lib/std/crypto/bigint.w', 'seed.lock', '.github/actions/source-sdk/action.yml') }}

    # Generation zero. The SDK build bootstraps from the fetched SDK's own
    # clang, clang++, cmake (with its module tree) and ninja, and its package
    # carries them for the next build. Published assets that predate the
    # packager keep `bin/clang` as a link without its target, or ship cmake
    # without `share/cmake-*`, or have no cmake/ninja at all — none of them
    # can bootstrap. Until an asset produced by this action is published on
    # every platform, seed each missing or dangling tool from the runner's
    # toolchain, and say so; the package this run produces bootstraps itself.
    - name: Seed bootstrap tools from the host when the SDK asset cannot bootstrap
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_ASSET_PREFIX: .deps/llvm-22.1.6-${{ inputs.host-tag }}
      run: |
        set -euo pipefail
        exe=""
        if [[ "$RUNNER_OS" == Windows ]]; then
          exe=".exe"
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          command -v ninja >/dev/null 2>&1 || choco install ninja -y --no-progress >/dev/null
        fi
        # The fetched SDK is read-only here: nothing is ever written into it.
        asset="$SDK_ASSET_PREFIX"
        usable() {
          local tool="$1" path="$asset/bin/$tool$exe"
          [[ -x "$(readlink -f "$path" 2>/dev/null || echo /nonexistent)" ]] || return 1
          if [[ "$tool" == cmake ]]; then
            ls -d "$asset"/share/cmake-*/Modules >/dev/null 2>&1 || return 1
            # Ninja's RC dependency scanner (see the seed copy below).
            [[ "$RUNNER_OS" != Windows || -f "$asset/bin/cmcldeps$exe" ]] || return 1
          fi
          return 0
        }
        need=0
        bootstrap_tools="clang clang++ cmake ninja"
        [[ "$RUNNER_OS" == Windows ]] && bootstrap_tools="$bootstrap_tools clang-cl lld-link"
        # LLVM's BLAKE3 on x86_64 Windows is MASM; sdk.w assembles it with the
        # bootstrap's llvm-ml64 (its packaging contract refuses anything else).
        [[ "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == X64 ]] && bootstrap_tools="$bootstrap_tools llvm-ml64"
        for tool in $bootstrap_tools; do
          usable "$tool" || need=1
        done
        if [[ $need == 0 ]]; then
          echo "SDK_BOOTSTRAP_PREFIX=$asset" >> "$GITHUB_ENV"
          echo "source-sdk: the fetched SDK bootstraps itself ($asset)"
          exit 0
        fi
        # Generation zero: a separate seed prefix holding only links to the
        # runner's tools; the fetched SDK stays untouched.
        seed=".deps/bootstrap-${{ inputs.host-tag }}"
        rm -rf "$seed"
        mkdir -p "$seed/bin"
        echo "SDK_BOOTSTRAP_PREFIX=$seed" >> "$GITHUB_ENV"
        # The runner's copy of a tool, never the asset's own (the asset's bin is
        # on PATH and is exactly what cannot bootstrap); on Windows `command -v`
        # drops the .exe, so the candidates are re-spelled with it.
        prefix_real="$(readlink -f "$asset")"
        host_tool() {
          local tool="$1" cand
          # Chocolatey's bin/ holds shims that run only beside their sidecar;
          # the real executables live under lib/<pkg>/tools, and Visual Studio
          # ships its own Ninja. Try those before PATH on Windows.
          if [[ "$RUNNER_OS" == Windows ]]; then
            for cand in /c/ProgramData/chocolatey/lib/$tool/tools/$tool.exe "/c/Program Files/Microsoft Visual Studio/"*/*/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/$tool.exe; do
              if [[ -f "$cand" ]]; then printf '%s\n' "$cand"; return 0; fi
            done
          fi
          while IFS= read -r cand; do
            [[ -n "$cand" ]] || continue
            [[ -f "$cand" ]] || cand="$cand$exe"
            [[ -f "$cand" ]] || continue
            case "$cand" in */[Cc]hocolatey/bin/*) continue;; esac
            case "$(readlink -f "$cand")" in "$prefix_real"/*) continue;; esac
            printf '%s\n' "$cand"
            return 0
          done < <(type -aP "$tool$exe" "$tool" 2>/dev/null)
          return 1
        }
        # A tool finds its own trees relative to its executable: cmake its
        # `share/cmake-X.Y` modules (CMAKE_ROOT), clang its `lib/clang`
        # resource headers. A copied binary loses them, so on unix the seed is
        # a symlink to the real path; on Windows, where cmake does not resolve
        # links, the companion trees are copied alongside.
        seed_tools="$bootstrap_tools"
        for tool in $seed_tools; do
          host="$(host_tool "$tool" || true)"
          # llvm-ml64 is LLVM's own alias of llvm-ml (add_llvm_tool_symlink);
          # a runner LLVM that installs only llvm-ml seeds it under that name.
          if [[ -z "$host" && "$tool" == llvm-ml64 ]]; then
            host="$(host_tool llvm-ml || true)"
          fi
          if [[ -z "$host" ]]; then
            echo "source-sdk: the SDK asset cannot bootstrap ($tool missing or dangling) and the runner has no $tool to seed from" >&2
            exit 1
          fi
          real="$(readlink -f "$host")"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp -f "$real" "$seed/bin/$tool$exe"
            hostprefix="$(dirname "$(dirname "$real")")"
            if [[ "$tool" == cmake ]]; then
              mkdir -p "$seed/share"
              cp -R "$hostprefix"/share/cmake-* "$seed/share/"
              # The Ninja generator's RC dependency scanner lives beside
              # cmake.exe. When it is missing, cmake silently emits the RC
              # rule without it and rc.exe receives the scanner's own
              # arguments: `fatal error RC1107: invalid usage`.
              cp -f "$(dirname "$real")/cmcldeps$exe" "$seed/bin/cmcldeps$exe"
            elif [[ "$tool" == clang && -d "$hostprefix/lib/clang" ]]; then
              mkdir -p "$seed/lib"
              cp -R "$hostprefix/lib/clang" "$seed/lib/"
            fi
          else
            ln -s "$real" "$seed/bin/$tool$exe"
          fi
          echo "source-sdk: bootstrap $tool seeded from the runner ($real) into $seed: the fetched SDK cannot bootstrap"
        done
        # A seed that cannot run is a failure here, with its name, not an
        # opaque configure error later.
        for tool in clang cmake ninja; do
          if ! "$seed/bin/$tool$exe" --version >/dev/null 2>&1; then
            echo "source-sdk: seeded $tool does not run ($seed/bin/$tool$exe --version failed)" >&2
            exit 1
          fi
        done
        if [[ "$RUNNER_OS" == Windows && ! -f "$seed/bin/cmcldeps$exe" ]]; then
          echo "source-sdk: seeded cmake has no cmcldeps$exe beside it; its Ninja RC rules would run rc.exe with the scanner's arguments" >&2
          exit 1
        fi

    - name: Build and package SDK from source
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_ASSET_PREFIX: .deps/llvm-22.1.6-${{ inputs.host-tag }}
        PARALLEL_JOBS: '4'
        LLVM_TARGETS_TO_BUILD: AArch64;X86;WebAssembly
      run: |
        set -euo pipefail
        # SDK_BOOTSTRAP_PREFIX comes from the seed step: the fetched SDK when it
        # can bootstrap, otherwise the separate seed prefix.
        test -n "${SDK_BOOTSTRAP_PREFIX:-}" || { echo "source-sdk: no bootstrap prefix chosen"; exit 1; }
        export PATH="$LLVM_PREFIX/bin:$PATH"
        if [[ "$RUNNER_OS" == macOS ]]; then
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
        fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          export INCLUDE="$WITH_WINDOWS_MSVC_INCDIR;$WITH_WINDOWS_UCRT_INCDIR;$WITH_WINDOWS_SHARED_INCDIR;$WITH_WINDOWS_UM_INCDIR"
          export LIB="$WITH_WINDOWS_MSVC_LIBDIR;$WITH_WINDOWS_UCRT_LIBDIR;$WITH_WINDOWS_UM_LIBDIR"
          kit="${WITH_WINDOWS_UCRT_INCDIR%/Include/*}"
          version="${WITH_WINDOWS_UCRT_INCDIR%/ucrt}"
          version="${version##*/}"
          export SDK_WINDOWS_MT="$kit/bin/$version/x64/mt.exe"
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then
            export SDK_WINDOWS_MT="$kit/bin/$version/arm64/mt.exe"
          fi
          export PATH="$(cygpath -u "${SDK_WINDOWS_MT%/*}"):$PATH"
          # The pinned seed embeds the older, whole-archive ToolFs writer.
          # Build today's native driver first so SDK packaging uses the
          # bounded-memory writer from this source tree on every host.
          ./src/main.exe build :dev
          export WITH="$(cygpath -m "$PWD/out/bootstrap/bin/with-stage1.exe")"
        else
          export LD_LIBRARY_PATH="$PWD/.link-shim:${LD_LIBRARY_PATH:-}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export WITH="$PWD/with-seed"
          else
            export WITH="$PWD/src/main"
          fi
          "$WITH" build :dev
          export WITH="$PWD/out/bootstrap/bin/with-stage1"
        fi
        "$WITH" build :sdk-package
        # The SDK contains only binaries we built, built by a toolchain we
        # built. A seeded (generation-zero) run compiled stage 1 with the
        # runner's compiler, so it is a bootstrap, never a product: build
        # again with stage 1's own clang/cmake/ninja and package that.
        if [[ "$SDK_BOOTSTRAP_PREFIX" != "$SDK_ASSET_PREFIX" ]]; then
          host="${{ inputs.host-tag }}"
          stage1=".deps/llvm-22.1.6-$host-stage1"
          rm -rf "$stage1"
          mv "out/sdk/$host/install/llvm-22.1.6-$host" "$stage1"
          rm -rf "out/sdk/$host" out/release/with-llvm-sdk-*
          export SDK_BOOTSTRAP_PREFIX="$stage1"
          echo "source-sdk: stage 1 was built by the runner's toolchain; rebuilding the SDK with stage 1's own tools ($stage1) and packaging only that"
          "$WITH" build :sdk-package
        fi

    - name: Check streamed archive round trip
      shell: bash
      run: |
        set -euo pipefail
        cd out/test-graph/sdk-contract-tests
        tar -xzf stream.tar.gz
        cmp payload.bin sample/payload.bin
        cmp empty sample/empty
        if [[ "$RUNNER_OS" != Windows ]]; then
          test -x sample/payload.bin
          test -L sample/alias
          cmp payload.bin sample/alias
        fi

    - name: Upload native SDK archive, digest and manifest
      uses: actions/upload-artifact@v4
      with:
        name: source-sdk-${{ inputs.host-tag }}
        path: out/release/with-llvm-sdk-*.tar.gz*
        if-no-files-found: error
        compression-level: 0

    - name: Unpack and select SDK artifact for compiler verification
      shell: bash
      env:
        SDK_HOST_TAG: ${{ inputs.host-tag }}
      run: |
        set -euo pipefail
        mkdir -p .deps/wasm-sdk
        for archive in out/release/with-llvm-sdk-*.tar.gz; do
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 -c "$archive.sha256"
          else
            sha256sum -c "$archive.sha256"
          fi
          tar -xzf "$archive" -C .deps/wasm-sdk
        done
        prefix="$PWD/.deps/wasm-sdk/llvm-22.1.6-$SDK_HOST_TAG"
        output="$PWD/out"
        if [[ "$RUNNER_OS" == Windows ]]; then
          prefix="$(cygpath -m "$prefix")"
          output="$(cygpath -m "$output")"
        fi
        echo "LLVM_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "WITH_OUT_DIR=$output" >> "$GITHUB_ENV"
        echo "$prefix/bin" >> "$GITHUB_PATH"

    - name: Save verified source-built SDK artifact
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          out/release/with-llvm-sdk-*.tar.gz*
          out/test-graph/sdk-contract-tests
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
