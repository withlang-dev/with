# The pinned bootstrap seed: the published release this tree is built from.
# Every CI lane reads it (`with run tools/bump_seed_pins.w` rewrites the
# workflow pins from it; `with build :seed-driver` refuses while any pin
# disagrees), `with build :seed` keeps src/main at it, and the battery is
# driven by it (`WITH=$PWD/src/main src/main build ...`). Bump it — version
# and every digest — in the same commit as the first change that needs a
# newer seed: tag the seed first.
#
# `<asset>.version=` pins one platform to another release while it cannot
# bootstrap the newest seed; say which issue, and remove it when fixed.
version=nightly-20260925-local-1-607a52f543e7
with-darwin-aarch64=7456c37b78f284670ce7fac060656ab1f4f243e99a1570736deb9ae65b715c53
# The darwin seed is built from this tree's annotation cleanup (607a52f5):
# it restores public return inference and embeds a stdlib whose
# `Diagnostics.error` infers Never. The previous seed (8d3cc360) predates
# public return inference, and main's a5c6f430 compiler embeds the old
# Unit signature, so neither can evaluate this tree's build layer.
# linux-x86_64 is main 2e8defaa, published from a local bootstrap: v0.15.2.1
# cannot build this tree, so it was laddered through 8c859a7d, 37f3a99f,
# 8e55d67b, fb6753b4 + the 4f004956 field-move fix, 8db10d1a, and the
# 607a52f5 hop (a stage1 of a5c6f430 embedding 607a52f5's lib/). The published
# binary builds main from a fresh checkout to a stage2 == stage3 fixpoint.
# linux-aarch64 stays on v0.15.2.0 until its nightly legs publish a newer
# asset (#1386, #1369, #1376).
with-linux-x86_64.version=nightly-20260926-local-1-2e8defaa18ef
with-linux-x86_64=ce5c3c4729650b215fb166ac8078fe7c7982b094bc4a1e31401e04eb7e7460d0
