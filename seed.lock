# The pinned bootstrap seed: the published release this tree is built from.
# Every CI lane reads it (`with run tools/bump_seed_pins.w` rewrites the
# workflow pins from it; `with build :seed-driver` refuses while any pin
# disagrees), `with build :seed` keeps src/main at it, and the battery is
# driven by it (`WITH=$PWD/src/main src/main build ...`). Bump it — version
# and every digest — in the same commit as the first change that needs a
# newer seed: tag the seed first.
#
# `<asset>.version=` pins one platform to another release while it cannot
# bootstrap the newest seed; say which issue, and remove it when fixed.
version=nightly-20261005-local-1-3207aacb2c74
with-darwin-aarch64=ceec31159b5436da3d3cb752c85f0ecd2837bb27fe5f06e0e7038d9a1718e03f
# darwin-aarch64, linux-x86_64 and windows-x86_64 are cut from main 3207aacb
# (2026-10-05), each on its own host from a stage2 == stage3 fixpoint: the
# first seeds whose std.libc has the libc constants (D90) and `Target` (D91)
# that a re-migrated corpus names, and whose `==` compares by type (#2137).
# Notes on the seeds before them:
# The darwin seed was cut from main c884c1c2 (stack #2001/#2010 merged): its
# Sema scans a view's later use in the view's own file only (#2001), so the
# tree no longer folds comments to dodge the old cross-file scan. Verified:
# it builds main from a fresh checkout to a stage2 == stage3 fixpoint over
# all 16 units. The previous seed (c95ae12d) is #1898's.
# linux-x86_64 is main 074a38b8, cut on eric-5090: the seed before it
# (2e8defaa) cannot compile main since 4cc11b86 (#2068). A fresh clone of main
# 8cc883a7 with it as the seed runs :deps, builds to a stage2 == stage3
# fixpoint over all 16 units and passes :no-host-toolchain.
# linux-aarch64 is wave-arm64 b78ceca2 (#1915, D81), bootstrapped natively in
# tools/docker/linux-aarch64 by a compiler cross-built on eric-5090 (v0.15.2.0
# cannot build this tree). It embeds its runtime, the glibc 2.28 sysroot,
# libc++ and lld: a fresh clone in a bare ubuntu:24.04 (git, curl, bubblewrap)
# runs :deps and build with no LLVM_PREFIX to a stage2 == stage3 fixpoint over
# all 16 units, and its release compiler is this binary byte for byte.
with-linux-x86_64=d9b731adf6334d4366068f21fee5dcab9d8e9ec2bf817f4277c811f62ba61a86
with-linux-aarch64.version=nightly-20261003-local-2-b78ceca2d3c5
with-linux-aarch64=c5b434ce739a0ef2a8beddf09abd30f1f501aa2b9227b07a0b16bdf65f8f2898
# windows-x86_64 is win-self-contained bd6e00d1 (#1915, D81): the first seed
# that carries its own linker (lld), dlltool, C runtime, clang resource
# directory and cmake/ninja, so a fresh Windows checkout runs :seed, :deps
# and build with no SDK, HOME or LLVM_PREFIX. Built on win10 from a fresh
# clone by the previous seed (6cd934e8) with the windows-gnu SDK of sdk.lock;
# stage2 == stage3 over all 16 units, and the published binary is that
# build's fixpoint-verified release compiler. windows-aarch64 stays on
# v0.15.2.1: cross-built from ea377276 (v0.15.2.1 + the #1089 embed-slot
# fix), an intermediate seed the native windows-aarch64 lane bootstraps and
# verifies.
with-windows-x86_64.exe=699bba4b9276cdc26bad8525796df9adb52a67a46b84400c3655c4351f50320d
with-windows-aarch64.exe.version=v0.15.2.1
