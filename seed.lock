# The pinned bootstrap seed: the published release this tree is built from.
# Every CI lane reads it (`with run tools/bump_seed_pins.w` rewrites the
# workflow pins from it; `with build :seed-driver` refuses while any pin
# disagrees), `with build :seed` keeps src/main at it, and the battery is
# driven by it (`WITH=$PWD/src/main src/main build ...`). Bump it — version
# and every digest — in the same commit as the first change that needs a
# newer seed: tag the seed first.
#
# `<asset>.version=` pins one platform to another release while it cannot
# bootstrap the newest seed; say which issue, and remove it when fixed.
version=nightly-20261020-local-1-e1d2b25e6d04
with-darwin-aarch64=3a92ac0e3a8b32467e2f88591e1b2271dd151f7757fdb07098d18593a0384dea
# darwin-aarch64, linux-x86_64 and windows-x86_64 are cut from main e1d2b25e6
# (2026-10-20): darwin on the laptop (studio128 is gone, Eric 2026-10-20)
# from a stage2 == stage3 fixpoint and a green :release-checks, linux-x86_64
# on eric-5090 and windows-x86_64 on win10 from a fixpoint: the first seeds
# whose Sema takes an @[effect] pin on a runtime ABI definition as its
# declared contract (D30 step 2, #2488), which the pins on rt/'s
# with_thread_spawn, with_vec_push_str and with_vec_append_bytes need.
# linux-aarch64 stays on the 10-15 release: its pinned seed cannot bootstrap
# main (#2490; a cross-built compiler re-cuts it). windows-aarch64 stays
# there until the cross seed dispatched from e1d2b25e6 (run 39452556233,
# D137) is pinned.
with-linux-aarch64.version=nightly-20261015-local-1-efcb91c30a6a
with-windows-aarch64.exe.version=nightly-20261015-local-1-efcb91c30a6a
