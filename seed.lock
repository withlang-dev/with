# The pinned bootstrap seed: the published release this tree is built from.
# Every CI lane reads it (`with run tools/bump_seed_pins.w` rewrites the
# workflow pins from it; `with build :seed-driver` refuses while any pin
# disagrees), `with build :seed` keeps src/main at it, and the battery is
# driven by it (`WITH=$PWD/src/main src/main build ...`). Bump it — version
# and every digest — in the same commit as the first change that needs a
# newer seed: tag the seed first.
#
# `<asset>.version=` pins one platform to another release while it cannot
# bootstrap the newest seed; say which issue, and remove it when fixed.
version=nightly-20261024-local-1-c1ea1de114eb
with-darwin-aarch64=709b14834061ae0d0c0e82f440f620b1bc683c159a27129c88cdb46d06a4c2f8
# darwin-aarch64 is cut from main c1ea1de11 (2026-10-24): the first seed with the
# D155 builtins (c_char and the C aliases are the target's), so compiler sources
# may spell c_char (#2585, #2596, #2597); :release-checks green on the laptop.
# All five are cut from main 763d0e54c (2026-10-20): the first seeds built
# after the D30 step 4 flip (#2500: the runtime bundle is the only link path,
# no .w-derived runtime objects) and R4c (#2504), with the wasm import
# reader (#2506) and the twin rt-slot join (#2507). darwin on the laptop
# (:release-checks green), linux-x86_64 on eric-5090, windows-x86_64 on
# win10, linux-aarch64 in tools/docker/linux-aarch64 (asset copied from
# out/release/bin/with, #2494), each from a stage2 == stage3 fixpoint.
# windows-aarch64 is the cross seed run 39537985417 (D137), copied onto the
# release. The seed before them:
# darwin-aarch64, linux-x86_64, windows-x86_64 and linux-aarch64 are cut from
# main 4d6d960d6 (2026-10-20, #2495): the local-1 seeds below it failed a
# fresh clone (#2493: a cached build graph's placeholder Sema met the actions
# a cold worktree evaluates itself). Each from a stage2 == stage3 fixpoint —
# darwin on the laptop (and a green :release-checks), linux-x86_64 on
# eric-5090, windows-x86_64 on win10, linux-aarch64 in tools/docker/linux-
# aarch64 — and each verified to bootstrap a fresh clone (`:deps` then
# `build`, no build store, no runner cache). windows-aarch64 is the cross
# seed run 39469556520 built from 4d6d960d6 (D137: an intermediate seed the
# native lane bootstraps and verifies), copied onto this release.
# Before them, the local-1 seeds were cut from main e1d2b25e6 the same day:
# the first whose Sema takes an @[effect] pin on a runtime ABI definition as
# its declared contract (D30 step 2, #2488), which rt/'s pins need.
# darwin-aarch64, linux-x86_64 and windows-x86_64 are cut from main efcb91c3
# (2026-10-15), each on its own host (studio128, eric-5090, win10) from a
# stage2 == stage3 fixpoint (darwin from a green :release-checks): the first
# seeds that embed std.encoding.xml (D135), which the facade proof engine
# reading GObject-introspection files (D121 step 3) uses in the compiler.
# darwin-aarch64, linux-x86_64 and windows-x86_64 are cut from main e4861e1d
# (2026-10-11), each on its own host (studio128, eric-5090, win10) from a
# stage2 == stage3 fixpoint: the first seeds whose runtime has the sized List
# helpers (`with_vec_*_es`, D115 Amendment 1 step 1) and `++` (D116), which
# the Vec header's step 2 (word 3 = `start`) needs.
# Before them, darwin-aarch64, linux-x86_64 and windows-x86_64 were cut from main 1140e660
# (2026-10-09), each on its own host from a stage2 == stage3 fixpoint: the
# first seeds that reject `Vec` (D118 step d) and own a str read through a
# view (#2307).
# Before them, darwin-aarch64, linux-x86_64 and windows-x86_64 were cut from main 2638c97a
# (2026-10-09), each on its own host from a stage2 == stage3 fixpoint: the
# first seeds that accept `List` (D118 step a), which the renamed tree needs.
# Before them, darwin-aarch64, linux-x86_64 and windows-x86_64 were cut from main 3207aacb
# (2026-10-05), each on its own host from a stage2 == stage3 fixpoint: the
# first seeds whose std.libc has the libc constants (D90) and `Target` (D91)
# that a re-migrated corpus names, and whose `==` compares by type (#2137).
# Notes on the seeds before them:
# The darwin seed was cut from main c884c1c2 (stack #2001/#2010 merged): its
# Sema scans a view's later use in the view's own file only (#2001), so the
# tree no longer folds comments to dodge the old cross-file scan. Verified:
# it builds main from a fresh checkout to a stage2 == stage3 fixpoint over
# all 16 units. The previous seed (c95ae12d) is #1898's.
# linux-x86_64 is main 074a38b8, cut on eric-5090: the seed before it
# (2e8defaa) cannot compile main since 4cc11b86 (#2068). A fresh clone of main
# 8cc883a7 with it as the seed runs :deps, builds to a stage2 == stage3
