# 8cc883a7 with it as the seed runs :deps, builds to a stage2 == stage3
# fixpoint over all 16 units and passes :no-host-toolchain.
# linux-aarch64 is cut from main 3d73b98c (#2305, D118), bootstrapped natively
# in tools/docker/linux-aarch64 to a stage2 == stage3 fixpoint over all 16
