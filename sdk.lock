# The pinned static LLVM SDKs: the release assets this tree is built and
# verified with, as seed.lock pins the seed (#1826). `with build :deps`
# installs this host's pin into .deps/llvm-<ver>-<host> and stamps it; a
# compiler link refuses a .deps SDK whose stamp is not the pin (LLVM_PREFIX,
# which CI sets after checking the workflow pin, is taken as named); and
# `with build :seed-driver` refuses while any workflow SDK pin disagrees
# with this file.
#
# `<asset>.version=` is the release, `<asset>=` the archive's sha256, and
# `.sha256=`/`.manifest=` the digests of its sidecar and manifest where a
# workflow pins those. A release asset replaced in place is a new SDK: pin
# its digest only after verifying it builds this tree.

# darwin-aarch64: 8b059526, built from source with the arm64e.x1 backport, so
# its ld64.lld reads Xcode 27's .tbd stubs (#1826, #1880). It carries its
# sysroot (`sysroot/`) and the dsymutil driver archive: a build reads the
# sysroot from it and fetches no Zig source (#2062, #1915).
with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.version=nightly-sdk-20261004-8b0595267bb0
with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz=d3abcdfd6f6ccc8094929e4053a15c28c45d1672108d5755460cd51607bd9406
with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.sha256=f4dc074646a19a24167ef577ed2f6965211601563d9cd31acecff65169b41415
with-llvm-sdk-22.1.6-darwin-aarch64.tar.gz.manifest=889371bbfebf203482fa4c2d3dd072681dedec557ad58f21b3f269385dbc064f

# linux-x86_64: built by build/sdk.w at c4ddb7dd against the With linux
# sysroot (glibc 2.28), with its own compiler-rt and static libc++ and no
# libxml2 (#1915, D81); every executable in it, cmake and ninja included,
# needs glibc 2.28+ and nothing else of the host. It carries its sysroot
# (`sysroot/`), so a build fetches no Zig source (#2062); its lld reads
# zlib-compressed sections, with the zlib the SDK builds (lib/libz.a); and
# the sysroot's glibc stubs define every symbol at every version, 2.28 the
# default binding, so a library built against a newer glibc links.
with-llvm-sdk-22.1.6-linux-x86_64.tar.gz.version=nightly-sdk-20261004-c4ddb7ddbef2
with-llvm-sdk-22.1.6-linux-x86_64.tar.gz=89751749724afcd2cd26f4022201797d310dc77c74f4b49689a0d2768db74785
