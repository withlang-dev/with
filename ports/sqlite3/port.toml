[port]
name = "sqlite3"
version = "3.53.4"

[source]
url = "https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

[build]
# The amalgamation; shell.c is the sqlite3 program.
sources = ["sqlite3.c"]
include = ["."]
public_include = ["."]
defines = ["SQLITE_THREADSAFE=1", "SQLITE_ENABLE_FTS5", "SQLITE_ENABLE_RTREE", "SQLITE_ENABLE_MATH_FUNCTIONS"]
lib = "sqlite3"

[link.linux]
system_libs = ["pthread", "dl", "m"]
