[port]
name = "raylib"
version = "6.0"

[source]
url = "https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz"
sha256 = "2b3ee1e2120c7a0796b33062c7e9a694dd8a8caa56a96319ac8c8ecf54a90d0b"

[build]
# raylib's own Makefile, PLATFORM_DESKTOP_GLFW with the bundled GLFW (rglfw.c).
sources = ["src/rcore.c", "src/rshapes.c", "src/rtextures.c", "src/rtext.c", "src/rmodels.c", "src/raudio.c", "src/rglfw.c"]
include = ["src", "src/external/glfw/include"]
public_include = ["src"]
defines = ["PLATFORM_DESKTOP_GLFW", "GRAPHICS_API_OPENGL_33"]
cflags = ["-std=gnu99", "-fno-strict-aliasing", "-Wno-missing-braces"]
lib = "raylib"

[build.linux]
# X11 headers come from the system (libx11-dev and friends); GLFW has no other
# window system to fall back to without generated Wayland protocol code.
defines = ["_GNU_SOURCE", "_GLFW_X11"]

[build.macos]
# rglfw.c includes GLFW's Cocoa sources, which are Objective-C.
cflags = ["-x", "objective-c"]

[link.linux]
system_libs = ["GL", "m", "pthread", "dl", "rt", "X11"]

[link.macos]
link_args = ["-framework", "OpenGL", "-framework", "Cocoa", "-framework", "IOKit", "-framework", "CoreAudio", "-framework", "CoreVideo"]
